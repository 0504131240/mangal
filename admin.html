<style>
:root{
  --bg:#FBF3EC;--surface:#fff;--surface2:#F3E7DA;--border:#EDE0D4;
  --text:#241712;--text2:#7A6A5E;--text3:#B0A296;
  --flame:#D8481B;--flame-dark:#9C2E0E;--flame-bg:#FCE9DF;
  --gold:#B9832A;--gold-bg:#FBF1DE;--char:#20140E;
  --ok:#1D9E75;--ok-bg:#E1F5EE;--bad:#A32D2D;--bad-bg:#FCEBEB;--warn:#B9832A;--warn-bg:#FBF1DE;
  --r:16px;--r2:11px;
  --font:'Rubik',-apple-system,'Segoe UI',Arial,sans-serif;
  --font-head:'Varela Round','Rubik',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button{font-family:var(--font)}

/* lock screen */
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:30px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(32,20,14,.1)}
.lock-ico{font-size:38px}
.lock-card h2{font-family:var(--font-head);margin-top:8px;font-size:18px}
.lock-card p{color:var(--text2);font-size:12.5px;margin-top:6px;margin-bottom:16px}
.lock-card input{width:100%;border:1.5px solid var(--border);border-radius:var(--r2);padding:12px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);text-align:center;direction:ltr;margin-bottom:8px}
.lock-card button.main{width:100%;padding:13px;border-radius:var(--r2);border:none;background:var(--flame);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:4px}
.lock-err{color:var(--bad);font-size:12.5px;margin-top:8px;display:none}

/* header */
.hdr{background:linear-gradient(135deg,var(--char),#3A2113);color:#fff;padding:20px 16px 22px;border-radius:0 0 20px 20px}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr-title{font-family:var(--font-head);font-size:18px;display:flex;align-items:center;gap:8px}
.hdr-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}

/* tabs */
.tabs{display:flex;gap:8px;margin:16px 0;overflow-x:auto;padding-bottom:2px}
.tab{position:relative;flex:1;min-width:100px;text-align:center;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);padding:11px 8px;border-radius:14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--char);color:#fff;border-color:var(--char)}
.tab .badge{position:absolute;top:-7px;left:-6px;background:var(--flame);color:#fff;font-size:10.5px;font-weight:800;border-radius:12px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 8px rgba(216,72,27,.4)}

.panel{display:none}
.panel.on{display:block}
.empty{text-align:center;color:var(--text3);font-size:13.5px;padding:40px 10px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 15px;margin-bottom:10px;cursor:pointer;position:relative}
.card.new::before{content:'חדש';position:absolute;top:-8px;right:12px;background:var(--flame);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-name{font-weight:700;font-size:14.5px}
.card-date{font-size:12px;color:var(--text2);font-weight:600}
.card-mid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.chip.lvl{background:var(--flame-bg);color:var(--flame-dark)}
.chip.paid-ok{background:var(--ok-bg);color:var(--ok)}
.chip.paid-part{background:var(--warn-bg);color:var(--warn)}
.chip.paid-no{background:var(--bad-bg);color:var(--bad)}
.card-notes{margin-top:8px;font-size:12.5px;color:var(--text3);line-height:1.5}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions button{flex:1;padding:9px;border-radius:9px;border:none;font-weight:700;font-size:12.5px;cursor:pointer}
.btn-approve{background:var(--ok);color:#fff}
.btn-decline{background:var(--bad-bg);color:var(--bad)}

.section-note{font-size:12px;color:var(--text3);margin:6px 2px 12px;text-align:center}
.toggle-row{display:flex;gap:8px;margin-bottom:12px}
.toggle-row button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer}
.toggle-row button.on{background:var(--flame-bg);border-color:var(--flame);color:var(--flame-dark)}

.debt-total{background:var(--bad-bg);color:var(--bad);border-radius:var(--r2);padding:14px 16px;text-align:center;margin-bottom:14px}
.debt-total b{display:block;font-size:22px;font-family:var(--font-head)}
.debt-total span{font-size:12px;font-weight:600}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(32,20,14,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;padding:20px 18px 26px}
@media(min-width:640px){.modal{border-radius:20px}}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-top h3{font-family:var(--font-head);font-size:17px}
.modal-close{background:var(--surface2);border:none;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--text2)}
.mfld{margin-top:12px}
.mfld label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:5px}
.mfld input,.mfld textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.minfo{font-size:13px;color:var(--text2);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px}
.minfo a{color:var(--flame-dark);font-weight:700;text-decoration:none}
.quickpay{display:flex;gap:8px;margin-top:8px}
.quickpay button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--text2)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;border-radius:11px;border:none;font-weight:700;font-size:13px;cursor:pointer}
.btn-save{background:var(--flame);color:#fff}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.status-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.status-pill{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer}
.status-pill.on{border-color:var(--char);background:var(--char);color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.btn-add-event{width:100%;padding:12px;border-radius:12px;border:none;background:var(--flame);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:14px;box-shadow:0 8px 18px rgba(216,72,27,.28)}

/* calendar */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-weight:700;font-family:var(--font-head);font-size:15px}
.cal-nav{background:var(--surface2);border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cal-weekdays{margin-bottom:4px;font-size:11px;color:var(--text3);font-weight:700;text-align:center}
.cal-cell{aspect-ratio:1/1;min-width:0;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;background:var(--surface);overflow:hidden}
.cal-cell.empty{border:none;background:transparent}
.cal-cell.has-events{cursor:pointer;border-color:var(--flame);background:var(--flame-bg);font-weight:700}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--char)}
.cal-dot{position:absolute;bottom:3px;font-size:9px;background:var(--flame);color:#fff;border-radius:8px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px}
</style>
</head>
<body>

<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyA5Qp3W1dcpd4ncnTyB68nMueXtHbAoLAk",
  authDomain: "mangal-b11fe.firebaseapp.com",
  projectId: "mangal-b11fe",
  storageBucket: "mangal-b11fe.firebasestorage.app",
  messagingSenderId: "523754634162",
  appId: "1:523754634162:web:aea58a2857650fadf082ab"
};
let _fb=null;
async function fbInit(){
  if(_fb)return _fb;
  const appMod=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
  const fsMod=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
  const app=appMod.initializeApp(firebaseConfig);
  const db=fsMod.getFirestore(app);
  _fb={db,doc:fsMod.doc,getDoc:fsMod.getDoc,setDoc:fsMod.setDoc,updateDoc:fsMod.updateDoc,deleteDoc:fsMod.deleteDoc,addDoc:fsMod.addDoc,
    onSnapshot:fsMod.onSnapshot,collection:fsMod.collection,query:fsMod.query,orderBy:fsMod.orderBy};
  return _fb;
}
const LEVELS = ['CLASIC','SPECIAL','CRAZY'];
const LEVEL_ICON = {'CLASIC':'🔥','SPECIAL':'🔥🔥','CRAZY':'👑'};

/* ===== auth (app-level password, hashed) ===== */
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let adminPassHash=null;
async function initLock(){
  try{
    const {db,doc,getDoc}=await fbInit();
    const snap=await getDoc(doc(db,'mangalSettings','admin'));
    if(snap.exists() && snap.data().passHash){
      adminPassHash=snap.data().passHash;
      if(localStorage.getItem('mangalAdminUnlocked')==='1'){ unlockApp(); return; }
      renderUnlockForm();
    } else {
      renderSetupForm();
    }
  }catch(err){
    console.error(err);
    renderLoadError(err);
  }
}
function renderLoadError(err){
  document.getElementById('lockTitle').textContent='לא הצליח להתחבר';
  document.getElementById('lockSub').textContent='נכשל חיבור למסד הנתונים (Firestore). ייתכן שחוקי האבטחה חוסמים את ה-collections mangalSettings/mangalBookings - יש להוסיף אותם בקונסולת Firebase (ראו README).';
  document.getElementById('lockBody').innerHTML=`
    <div style="font-size:11px;color:var(--text3);direction:ltr;text-align:left;background:var(--bg);border-radius:8px;padding:8px;margin-bottom:10px;word-break:break-all">${esc(err&&err.message||String(err))}</div>
    <button class="main" onclick="location.reload()">ניסיון חדש</button>`;
}
function renderSetupForm(){
  document.getElementById('lockTitle').textContent='הגדרת סיסמת מנהל';
  document.getElementById('lockSub').textContent='זו הכניסה הראשונה - בחרו סיסמה לניהול';
  document.getElementById('lockBody').innerHTML=`
    <input type="password" id="p1" placeholder="סיסמה חדשה">
    <input type="password" id="p2" placeholder="אימות סיסמה" onkeydown="if(event.key==='Enter')doSetup()">
    <button class="main" onclick="doSetup()">הגדרת סיסמה</button>`;
}
async function doSetup(){
  const p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
  const errEl=document.getElementById('lockErr');
  if(!p1||p1.length<4){errEl.textContent='סיסמה חייבת להכיל לפחות 4 תווים';errEl.style.display='block';return;}
  if(p1!==p2){errEl.textContent='הסיסמאות אינן תואמות';errEl.style.display='block';return;}
  errEl.style.display='none';
  const {db,doc,setDoc}=await fbInit();
  const hash=await sha256(p1);
  await setDoc(doc(db,'mangalSettings','admin'),{passHash:hash});
  localStorage.setItem('mangalAdminUnlocked','1');
  unlockApp();
}
function renderUnlockForm(){
  document.getElementById('lockTitle').textContent='ניהול BBQ';
  const hasBio = !!localStorage.getItem('mangalBiometricCredId') && window.PublicKeyCredential;
  document.getElementById('lockSub').textContent='הזינו סיסמה כדי להיכנס';
  document.getElementById('lockBody').innerHTML=`
    ${hasBio?`<button id="biometricBtn" class="main" style="background:var(--char);margin-bottom:10px" onclick="doBiometricUnlock()">👆 כניסה עם טביעת אצבע</button><div style="font-size:11px;color:var(--text3);margin-bottom:10px">— או עם סיסמה —</div>`:''}
    <input type="password" id="unlockInp" placeholder="סיסמה" onkeydown="if(event.key==='Enter')doUnlock()">
    <button class="main" onclick="doUnlock()">כניסה</button>`;
  if(hasBio) setTimeout(()=>doBiometricUnlock(),300);
  else setTimeout(()=>{const i=document.getElementById('unlockInp');if(i)i.focus();},50);
}

/* ===== biometric (WebAuthn) ===== */
function _ab2b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function _b642ab(b64){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr.buffer;}
async function registerBiometric(){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'BBQ',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'admin',displayName:'מנהל'},
      pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000
    }});
    localStorage.setItem('mangalBiometricCredId',_ab2b64(cred.rawId));
    return true;
  }catch(e){ console.error(e); return false; }
}
async function tryBiometric(){
  const b64=localStorage.getItem('mangalBiometricCredId');
  if(!b64||!window.PublicKeyCredential) return false;
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{id:_b642ab(b64),type:'public-key'}],
      userVerification:'required',
      timeout:60000
    }});
    return true;
  }catch(e){ return false; }
}
async function doBiometricUnlock(){
  const btn=document.getElementById('biometricBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ מאמת...';}
  const ok=await tryBiometric();
  if(ok){ localStorage.setItem('mangalAdminUnlocked','1'); unlockApp(); }
  else if(btn){btn.disabled=false;btn.textContent='👆 כניסה עם טביעת אצבע';}
}
async function toggleBiometricSetting(){
  const has=!!localStorage.getItem('mangalBiometricCredId');
  if(has){
    localStorage.removeItem('mangalBiometricCredId');
    showToast('טביעת אצבע בוטלה');
  } else {
    if(!window.PublicKeyCredential){ showToast('הדפדפן לא תומך בטביעת אצבע'); return; }
    const ok=await registerBiometric();
    showToast(ok?'טביעת אצבע הופעלה ✓':'ההפעלה נכשלה או בוטלה');
  }
  updateBioBtn();
}
function updateBioBtn(){
  const btn=document.getElementById('bioBtn');
  if(!btn) return;
  const has=!!localStorage.getItem('mangalBiometricCredId');
  btn.textContent = has ? '👆 טביעת אצבע פעילה' : '👆 הפעל טביעת אצבע';
}
async function doUnlock(){
  const val=document.getElementById('unlockInp').value||'';
  const hash=await sha256(val);
  if(hash===adminPassHash){
    localStorage.setItem('mangalAdminUnlocked','1');
    unlockApp();
  } else {
    const err=document.getElementById('lockErr');
    err.textContent='סיסמה שגויה';err.style.display='block';
    document.getElementById('unlockInp').value='';
  }
}
function lockOut(){
  localStorage.removeItem('mangalAdminUnlocked');
  location.reload();
}
function unlockApp(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('app').style.display='block';
  updateBioBtn();
  startListening();
}

/* ===== data ===== */
let bookings=[];
let knownPendingIds=new Set();
let firstLoad=true;
let notifPermission=false;

async function startListening(){
  const {db,collection,query,orderBy,onSnapshot}=await fbInit();
  const q=query(collection(db,'mangalBookings'), orderBy('date','asc'));
  onSnapshot(q, (snap)=>{
    bookings=snap.docs.map(d=>({id:d.id,...d.data()}));
    checkNewPending();
    renderAll();
  }, (err)=>{
    console.error(err);
  });
  notifPermission = (typeof Notification!=='undefined' && Notification.permission==='granted');
  updateNotifBtn();
}
function checkNewPending(){
  const currentPending=bookings.filter(b=>b.status==='pending').map(b=>b.id);
  if(!firstLoad){
    const newOnes=currentPending.filter(id=>!knownPendingIds.has(id));
    if(newOnes.length){
      beep();
      if(notifPermission){
        const b=bookings.find(x=>x.id===newOnes[0]);
        try{ new Notification('בקשת אירוע חדשה! 🔥', {body: b ? `${b.name} · ${b.guests} אנשים · ${b.date}` : 'בקשה חדשה התקבלה'}); }catch(e){}
      }
      showToast(newOnes.length===1?'התקבלה בקשת אירוע חדשה 🔥':`התקבלו ${newOnes.length} בקשות חדשות 🔥`);
    }
  }
  knownPendingIds=new Set(currentPending);
  firstLoad=false;
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
    o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.4);
  }catch(e){}
}
function showToast(msg){
  const root=document.getElementById('toastRoot');
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(),3800);
}
async function toggleNotifications(){
  if(typeof Notification==='undefined'){showToast('הדפדפן לא תומך בהתראות');return;}
  if(Notification.permission==='granted'){notifPermission=true;showToast('התראות כבר פעילות ✓');return;}
  const perm=await Notification.requestPermission();
  notifPermission = perm==='granted';
  updateNotifBtn();
  showToast(notifPermission?'התראות הופעלו ✓':'התראות לא אושרו');
}
function updateNotifBtn(){
  const btn=document.getElementById('notifBtn');
  if(btn) btn.textContent = notifPermission ? '🔔 התראות פעילות' : '🔕 הפעל התראות';
}

/* ===== tabs ===== */
let currentTab='pending';
function setTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('on',el.id==='panel-'+t));
}
let boardFilter='upcoming';
function setBoardFilter(f){
  boardFilter=f;
  document.getElementById('btnUpcoming').classList.toggle('on',f==='upcoming');
  document.getElementById('btnPast').classList.toggle('on',f==='past');
  renderBoard();
}
let boardView='list';
function setBoardView(v){
  boardView=v;
  document.getElementById('viewList').classList.toggle('on',v==='list');
  document.getElementById('viewCalendar').classList.toggle('on',v==='calendar');
  document.getElementById('boardListWrap').style.display = v==='list' ? 'block':'none';
  document.getElementById('boardCalendarWrap').style.display = v==='calendar' ? 'block':'none';
  if(v==='calendar') renderCalendar();
}
let calMonth=new Date(); calMonth.setDate(1);
function calShift(dir){
  calMonth.setMonth(calMonth.getMonth()+dir);
  renderCalendar();
}
function renderCalendar(){
  const el=document.getElementById('boardCalendarWrap');
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const startWeekday=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthName=calMonth.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  const todayStr=new Date().toISOString().slice(0,10);

  const byDay={};
  bookings.filter(b=>b.status==='approved' && b.date).forEach(b=>{
    (byDay[b.date]=byDay[b.date]||[]).push(b);
  });

  let cells='';
  for(let i=0;i<startWeekday;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const evs=byDay[dateStr]||[];
    cells+=`<div class="cal-cell ${evs.length?'has-events':''} ${dateStr===todayStr?'today':''}" ${evs.length?`onclick="openDayEvents('${dateStr}')"`:''}>
      <span>${day}</span>
      ${evs.length?`<span class="cal-dot">${evs.length}</span>`:''}
    </div>`;
  }

  el.innerHTML=`
    <div class="cal-hdr">
      <button class="cal-nav" onclick="calShift(-1)">‹ הקודם</button>
      <div class="cal-title">${monthName}</div>
      <button class="cal-nav" onclick="calShift(1)">הבא ›</button>
    </div>
    <div class="cal-grid cal-weekdays">${['א','ב','ג','ד','ה','ו','ש'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}
function openDayEvents(dateStr){
  const evs=bookings.filter(b=>b.status==='approved' && b.date===dateStr);
  if(evs.length===1){ openModal(evs[0].id); return; }
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-top"><h3>${fmtDate(dateStr)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        ${evs.map(b=>`<div class="card" onclick="openModal('${b.id}')">
          <div class="card-top"><div class="card-name">${esc(b.name)}</div></div>
          <div class="card-mid"><span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span><span class="chip">👥 ${b.guests} אנשים</span>${paidChip(b)}</div>
        </div>`).join('')}
      </div>
    </div>`;
}

function fmtDate(d){
  if(!d)return '';
  try{ return new Date(d+'T00:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric',weekday:'short'}); }
  catch(e){ return d; }
}
function paidChip(b){
  const total=Number(b.totalPrice||0), paid=Number(b.paidAmount||0);
  if(total<=0) return `<span class="chip">מחיר טרם נקבע</span>`;
  if(paid>=total) return `<span class="chip paid-ok">✓ שולם במלואו</span>`;
  if(paid>0) return `<span class="chip paid-part">שולם חלקית (${paid}/${total}₪)</span>`;
  return `<span class="chip paid-no">לא שולם (${total}₪)</span>`;
}

function renderAll(){
  renderPending();
  renderBoard();
  if(boardView==='calendar') renderCalendar();
  renderDebts();
}

/* ===== pending tab ===== */
function renderPending(){
  const pending=bookings.filter(b=>b.status==='pending');
  const badge=document.getElementById('badgePending');
  if(pending.length){badge.style.display='flex';badge.textContent=pending.length;}
  else badge.style.display='none';
  document.title = pending.length ? `(${pending.length}) לוח ניהול · מנגל בלהבות` : 'ניהול · מנגל בלהבות';

  const list=document.getElementById('pendingList');
  if(!pending.length){
    list.innerHTML=`<div class="empty">אין בקשות חדשות כרגע 🌿</div>`;
  } else {
    list.innerHTML=pending.map(b=>`
      <div class="card new">
        <div class="card-top">
          <div class="card-name">${esc(b.name)}</div>
          <div class="card-date">📅 ${fmtDate(b.date)}</div>
        </div>
        <div class="card-mid">
          <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
          <span class="chip">👥 ${b.guests} אנשים</span>
          ${b.location?`<span class="chip">📍 ${esc(b.location)}</span>`:''}
        </div>
        ${b.notes?`<div class="card-notes">"${esc(b.notes)}"</div>`:''}
        <div class="minfo">📞 <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>${b.email?` · ✉️ ${esc(b.email)}`:''}</div>
        <div class="card-actions">
          <button class="btn-approve" onclick="event.stopPropagation();approveBooking('${b.id}')">✅ אישור</button>
          <button class="btn-decline" onclick="event.stopPropagation();declineBooking('${b.id}')">❌ דחייה</button>
        </div>
      </div>`).join('');
  }

  const declined=bookings.filter(b=>b.status==='declined');
  const dWrap=document.getElementById('declinedWrap');
  if(!declined.length){ dWrap.innerHTML=''; return; }
  dWrap.innerHTML=`<div class="section-note">בקשות שנדחו (${declined.length})</div>` +
    declined.map(b=>`<div class="card" style="opacity:.6" onclick="openModal('${b.id}')">
      <div class="card-top"><div class="card-name">${esc(b.name)}</div><div class="card-date">📅 ${fmtDate(b.date)}</div></div>
    </div>`).join('');
}
async function approveBooking(id){
  const {db,doc,updateDoc}=await fbInit();
  await updateDoc(doc(db,'mangalBookings',id),{status:'approved'});
  showToast('האירוע אושר ונכנס ללוח ✓');
}
async function declineBooking(id){
  if(!confirm('לדחות את הבקשה הזו?'))return;
  const {db,doc,updateDoc}=await fbInit();
  await updateDoc(doc(db,'mangalBookings',id),{status:'declined'});
  showToast('הבקשה נדחתה');
}

/* ===== board tab ===== */
function renderBoard(){
  const today=new Date().toISOString().slice(0,10);
  let list=bookings.filter(b=>b.status==='approved');
  list = boardFilter==='upcoming' ? list.filter(b=>b.date>=today) : list.filter(b=>b.date<today);
  if(boardFilter==='past') list=list.slice().reverse();
  const el=document.getElementById('boardList');
  if(!list.length){ el.innerHTML=`<div class="empty">אין אירועים ${boardFilter==='upcoming'?'קרובים':'מהעבר'} בלוח</div>`; return; }
  el.innerHTML=list.map(b=>`
    <div class="card" onclick="openModal('${b.id}')">
      <div class="card-top">
        <div class="card-name">${esc(b.name)}</div>
        <div class="card-date">📅 ${fmtDate(b.date)}</div>
      </div>
      <div class="card-mid">
        <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
        <span class="chip">👥 ${b.guests} אנשים</span>
        ${b.location?`<span class="chip">📍 ${esc(b.location)}</span>`:''}
        ${paidChip(b)}
      </div>
    </div>`).join('');
}

/* ===== debts tab ===== */
function renderDebts(){
  const debts=bookings.filter(b=>b.status==='approved' && Number(b.totalPrice||0)>0 && Number(b.paidAmount||0)<Number(b.totalPrice||0));
  debts.sort((a,b)=>a.date<b.date?-1:1);
  const badge=document.getElementById('badgeDebts');
  if(debts.length){badge.style.display='flex';badge.textContent=debts.length;} else badge.style.display='none';

  const totalOwed=debts.reduce((s,b)=>s+(Number(b.totalPrice||0)-Number(b.paidAmount||0)),0);
  const totalEl=document.getElementById('debtsTotal');
  totalEl.innerHTML = debts.length ? `<div class="debt-total"><b>${totalOwed.toLocaleString()}₪</b><span>סה"כ חוב פתוח מ-${debts.length} אירועים</span></div>` : '';

  const el=document.getElementById('debtsList');
  if(!debts.length){ el.innerHTML=`<div class="empty">אין חובות פתוחים 🎉</div>`; return; }
  el.innerHTML=debts.map(b=>{
    const owe=Number(b.totalPrice||0)-Number(b.paidAmount||0);
    return `<div class="card" onclick="openModal('${b.id}')">
      <div class="card-top">
        <div class="card-name">${esc(b.name)}</div>
        <div class="card-date">📅 ${fmtDate(b.date)}</div>
      </div>
      <div class="card-mid">
        <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
        ${paidChip(b)}
        <span class="chip" style="background:var(--bad-bg);color:var(--bad)">חסר ${owe.toLocaleString()}₪</span>
      </div>
    </div>`;
  }).join('');
}

/* ===== modal ===== */
function openModal(id){
  const b=bookings.find(x=>x.id===id);
  if(!b)return;
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-top">
          <h3>${esc(b.name)}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="card-mid">
          <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
          <span class="chip">📅 ${fmtDate(b.date)}</span>
        </div>
        <div class="minfo">📞 <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>${b.email?` · ✉️ ${esc(b.email)}`:''}</div>
        ${b.notes?`<div class="minfo">📝 ${esc(b.notes)}</div>`:''}

        <div class="mfld"><label>מספר משתתפים</label><input type="number" id="mGuests" value="${b.guests||0}" min="1"></div>
        <div class="mfld"><label>מיקום האירוע</label><input type="text" id="mLocation" value="${b.location?esc(b.location):''}" placeholder="כתובת / אולם / חצר"></div>

        <div class="mrow">
          <div class="mfld"><label>מחיר כולל (₪)</label><input type="number" id="mTotal" value="${b.totalPrice||0}" min="0"></div>
          <div class="mfld"><label>שולם עד כה (₪)</label><input type="number" id="mPaid" value="${b.paidAmount||0}" min="0"></div>
        </div>
        <div class="quickpay">
          <button onclick="document.getElementById('mPaid').value=document.getElementById('mTotal').value">✓ סמן ששולם במלואו</button>
          <button onclick="document.getElementById('mPaid').value=0">↺ אפס תשלום</button>
        </div>

        <div class="mfld"><label>סטטוס אירוע</label>
          <div class="status-row">
            <div class="status-pill ${b.status==='pending'?'on':''}" onclick="setModalStatus(this,'pending')">ממתין לאישור</div>
            <div class="status-pill ${b.status==='approved'?'on':''}" onclick="setModalStatus(this,'approved')">מאושר</div>
            <div class="status-pill ${b.status==='declined'?'on':''}" onclick="setModalStatus(this,'declined')">נדחה/בוטל</div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn-danger" onclick="deleteBooking('${b.id}')">🗑️ מחיקה</button>
          <button class="btn-save" onclick="saveModal('${b.id}')">💾 שמירה</button>
        </div>
      </div>
    </div>`;
  root.dataset.status=b.status;
}
function setModalStatus(el,status){
  document.querySelectorAll('.status-pill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('modalRoot').dataset.status=status;
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
async function saveModal(id){
  const guests=parseInt(document.getElementById('mGuests').value,10)||0;
  const location=document.getElementById('mLocation').value.trim();
  const totalPrice=parseFloat(document.getElementById('mTotal').value)||0;
  const paidAmount=parseFloat(document.getElementById('mPaid').value)||0;
  const status=document.getElementById('modalRoot').dataset.status||'approved';
  const {db,doc,updateDoc}=await fbInit();
  await updateDoc(doc(db,'mangalBookings',id),{guests,location:location||null,totalPrice,paidAmount,status});
  closeModal();
  showToast('נשמר ✓');
}
async function deleteBooking(id){
  if(!confirm('למחוק את האירוע הזה לצמיתות?'))return;
  const {db,doc,deleteDoc}=await fbInit();
  await deleteDoc(doc(db,'mangalBookings',id));
  closeModal();
  showToast('נמחק');
}

/* ===== manual event creation ===== */
function openNewEventModal(){
  const today=new Date().toISOString().slice(0,10);
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-top"><h3>הוספת אירוע חדש</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div class="mfld"><label>שם הלקוח / אירוע *</label><input type="text" id="nName" placeholder="שם"></div>
        <div class="mrow">
          <div class="mfld"><label>טלפון</label><input type="tel" id="nPhone" placeholder="050-0000000"></div>
          <div class="mfld"><label>תאריך *</label><input type="date" id="nDate" value="${today}"></div>
        </div>
        <div class="mfld"><label>רמת אירוע</label>
          <div class="status-row" id="nLevelRow">
            ${LEVELS.map((l,i)=>`<div class="status-pill ${i===0?'on':''}" onclick="setNLevel(this,'${l}')">${LEVEL_ICON[l]} ${l}</div>`).join('')}
          </div>
        </div>
        <div class="mrow">
          <div class="mfld"><label>מספר משתתפים</label><input type="number" id="nGuests" min="1" value="1"></div>
          <div class="mfld"><label>מיקום</label><input type="text" id="nLocation" placeholder="כתובת / אולם / חצר"></div>
        </div>
        <div class="mfld"><label>הערות</label><textarea id="nNotes"></textarea></div>
        <div class="mrow">
          <div class="mfld"><label>מחיר כולל (₪)</label><input type="number" id="nTotal" min="0" value="0"></div>
          <div class="mfld"><label>שולם עד כה (₪)</label><input type="number" id="nPaid" min="0" value="0"></div>
        </div>
        <div class="modal-actions">
          <button class="btn-danger" onclick="closeModal()">ביטול</button>
          <button class="btn-save" onclick="saveNewEvent()">💾 שמירה</button>
        </div>
      </div>
    </div>`;
  root.dataset.nlevel=LEVELS[0];
}
function setNLevel(el,lvl){
  document.querySelectorAll('#nLevelRow .status-pill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('modalRoot').dataset.nlevel=lvl;
}
async function saveNewEvent(){
  const name=document.getElementById('nName').value.trim();
  const date=document.getElementById('nDate').value;
  if(!name||!date){ showToast('נא למלא שם ותאריך'); return; }
  const phone=document.getElementById('nPhone').value.trim();
  const guests=parseInt(document.getElementById('nGuests').value,10)||1;
  const location=document.getElementById('nLocation').value.trim();
  const notes=document.getElementById('nNotes').value.trim();
  const totalPrice=parseFloat(document.getElementById('nTotal').value)||0;
  const paidAmount=parseFloat(document.getElementById('nPaid').value)||0;
  const level=document.getElementById('modalRoot').dataset.nlevel||LEVELS[0];
  const {db,collection,addDoc}=await fbInit();
  await addDoc(collection(db,'mangalBookings'),{
    name, phone:phone||null, date, guests, level, location:location||null, notes:notes||null,
    status:'approved', totalPrice, paidAmount,
    createdAtMs:Date.now(), source:'admin'
  });
  closeModal();
  showToast('האירוע נוסף ללוח ✓');
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

initLock();
</script>
