<!--
  לוח ניהול פרטי לעסק המנגלים - לא מקושר מהאתר הציבורי חוץ מקישור קטן בפוטר.
  הכניסה היא עם חשבון Google. מי מורשה נקבע בחוקי האבטחה (firestore.rules): הבעלים שכתובים
  בחוקים, ומיילים שהם מוסיפים בהגדרות (mangalSettings/admins). ראו README.md.
-->
<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ניהול · BBQ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#20140E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ניהול BBQ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="images/app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF3EC;--surface:#fff;--surface2:#F3E7DA;--border:#EDE0D4;
  --text:#241712;--text2:#7A6A5E;--text3:#B0A296;
  --flame:#D8481B;--flame-dark:#9C2E0E;--flame-bg:#FCE9DF;
  --gold:#B9832A;--gold-bg:#FBF1DE;--char:#20140E;
  --ok:#1D9E75;--ok-bg:#E1F5EE;--bad:#A32D2D;--bad-bg:#FCEBEB;--warn:#B9832A;--warn-bg:#FBF1DE;
  --r:16px;--r2:11px;
  --font:'Rubik',-apple-system,'Segoe UI',Arial,sans-serif;
  --font-head:'Varela Round','Rubik',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button{font-family:var(--font)}

/* lock screen */
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:30px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(32,20,14,.1)}
.lock-ico{font-size:38px}
.lock-card h2{font-family:var(--font-head);margin-top:8px;font-size:18px}
.lock-card p{color:var(--text2);font-size:12.5px;margin-top:6px;margin-bottom:16px}
.lock-card input{width:100%;border:1.5px solid var(--border);border-radius:var(--r2);padding:12px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);text-align:center;direction:ltr;margin-bottom:8px}
.lock-card button.main{width:100%;padding:13px;border-radius:var(--r2);border:none;background:var(--flame);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:4px}
.install-btn{width:100%;padding:11px;border-radius:var(--r2);border:1.5px dashed var(--border);background:transparent;color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer;margin-top:14px;font-family:var(--font)}
.install-btn:hover{border-color:var(--flame);color:var(--flame-dark)}
.lock-err{color:var(--bad);font-size:12.5px;margin-top:8px;display:none}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff!important;color:#1f1f1f!important;border:1.5px solid #dadce0!important;margin-top:6px}
.google-btn:disabled{opacity:.6}
.link-btn{display:block;margin:10px auto 0;background:none;border:none;color:var(--text2);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;font-family:var(--font)}
.admin-me{font-size:12px;color:var(--text2);margin-bottom:8px}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:13px}
.admin-row span{min-width:0;overflow-wrap:anywhere}
.admin-del{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:none;background:var(--bad-bg);color:var(--bad);cursor:pointer}
.admin-empty{font-size:12.5px;color:var(--text3);margin-bottom:6px}
.admin-add{display:flex;gap:8px;margin-top:4px}
.admin-add input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text)}
.admin-hint{display:block;font-size:11.5px;color:var(--text3);margin-top:6px;line-height:1.5}

/* header */
.hdr{background:linear-gradient(135deg,var(--char),#3A2113);color:#fff;padding:20px 16px 22px;border-radius:0 0 20px 20px}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr-title{font-family:var(--font-head);font-size:18px;display:flex;align-items:center;gap:8px}
.hdr-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.hdr-actions{display:flex;gap:8px;flex-shrink:0}
.share-opts{display:flex;flex-direction:column;gap:8px}
.share-opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:var(--r2);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;font-family:var(--font);text-align:right}
.share-opt .ico{font-size:20px;width:26px;text-align:center}
.share-url{width:100%;margin-top:12px;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text2);direction:ltr;text-align:left}

/* tabs */
.tabs{display:flex;gap:8px;margin:16px 0;overflow-x:auto;padding-bottom:2px}
.tab{position:relative;flex:1;min-width:100px;text-align:center;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);padding:11px 8px;border-radius:14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--char);color:#fff;border-color:var(--char)}
.tab .badge{position:absolute;top:-7px;left:-6px;background:var(--flame);color:#fff;font-size:10.5px;font-weight:800;border-radius:12px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 8px rgba(216,72,27,.4)}

.panel{display:none}
.panel.on{display:block}
.empty{text-align:center;color:var(--text3);font-size:13.5px;padding:40px 10px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 15px;margin-bottom:10px;cursor:pointer;position:relative}
.card.new::before{content:'חדש';position:absolute;top:-8px;right:12px;background:var(--flame);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-name{font-weight:700;font-size:14.5px}
.card-date{font-size:12px;color:var(--text2);font-weight:600}
.card-mid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.chip.lvl{background:var(--flame-bg);color:var(--flame-dark)}
.chip.massage{background:#EDE3F6;color:#5B3A86}
.mcheck{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-size:14px;font-weight:600;cursor:pointer}
.mcheck input{width:20px;height:20px;accent-color:#F2662B}
.chip.paid-ok{background:var(--ok-bg);color:var(--ok)}
.chip.paid-part{background:var(--warn-bg);color:var(--warn)}
.chip.paid-no{background:var(--bad-bg);color:var(--bad)}
.card-notes{margin-top:8px;font-size:12.5px;color:var(--text3);line-height:1.5}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions button{flex:1;padding:9px;border-radius:9px;border:none;font-weight:700;font-size:12.5px;cursor:pointer}
.btn-approve{background:var(--ok);color:#fff}
.btn-decline{background:var(--bad-bg);color:var(--bad)}

.section-note{font-size:12px;color:var(--text3);margin:6px 2px 12px;text-align:center}
.toggle-row{display:flex;gap:8px;margin-bottom:12px}
.toggle-row button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer}
.toggle-row button.on{background:var(--flame-bg);border-color:var(--flame);color:var(--flame-dark)}

.debt-total{background:var(--bad-bg);color:var(--bad);border-radius:var(--r2);padding:14px 16px;text-align:center;margin-bottom:14px}
.debt-total b{display:block;font-size:22px;font-family:var(--font-head)}
.debt-total span{font-size:12px;font-weight:600}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(32,20,14,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;padding:20px 18px 26px}
@media(min-width:640px){.modal{border-radius:20px}}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-top h3{font-family:var(--font-head);font-size:17px}
.modal-close{background:var(--surface2);border:none;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--text2)}
.mfld{margin-top:12px}
.mfld label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:5px}
.mfld input,.mfld textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.drow-sub{font-weight:500;color:var(--text2);font-size:12px}
.minfo{font-size:13px;color:#5E4F44;background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px}
.minfo a{color:var(--flame-dark);font-weight:700;text-decoration:none}
.quickpay{display:flex;gap:8px;margin-top:8px}
.quickpay button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--text2)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.dlist{margin-top:12px;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;font-size:13px;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.drow span{color:var(--text2);flex-shrink:0}
.drow b{font-weight:700;text-align:left;min-width:0;overflow-wrap:anywhere}
.drow a{color:var(--flame-dark);text-decoration:none}
.modal-actions button{flex:1;padding:12px;border-radius:11px;border:none;font-weight:700;font-size:13px;cursor:pointer}
.btn-save{background:#C63F14;color:#fff}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.status-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.status-pill{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer}
.status-pill.on{border-color:var(--char);background:var(--char);color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.btn-add-event{width:100%;padding:12px;border-radius:12px;border:none;background:var(--flame);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:14px;box-shadow:0 8px 18px rgba(216,72,27,.28)}

/* calendar */
.cal-mode-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-mode-toggle{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.cal-mode-toggle button{border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer}
.cal-mode-toggle button.on{background:var(--char);color:#fff}
.cal-today-btn{background:var(--surface2);border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;flex-shrink:0;white-space:nowrap}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.cal-hdr>div{text-align:center;min-width:0}
.cal-title{font-weight:700;font-family:var(--font-head);font-size:15px}
.cal-subtitle{font-size:10.5px;color:var(--text3);margin-top:1px}
.cal-nav{background:var(--surface2);border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cal-weekdays{margin-bottom:4px;font-size:11px;color:var(--text3);font-weight:700;text-align:center}
.cal-cell{aspect-ratio:1/1;min-width:0;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;background:var(--surface);overflow:hidden}
.cal-he-day{font-size:12px;font-weight:700;white-space:nowrap}
.cal-greg-day{font-size:8.5px;color:var(--text3);margin-top:1px}
.cal-cell.has-events .cal-greg-day{color:var(--flame-dark);opacity:.75}
.cal-cell.cal-blank{border:none;background:transparent}
.cal-cell.has-events{cursor:pointer;border-color:var(--flame);background:var(--flame-bg);font-weight:700}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--char)}
/* settings */
.set-sec{margin-top:16px}
.set-title{font-size:11.5px;font-weight:800;color:var(--text3);letter-spacing:.3px;margin-bottom:8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:8px}
.set-txt{min-width:0}
.set-txt b{display:block;font-size:13.5px}
.set-txt small{display:block;font-size:11.5px;color:var(--text3);margin-top:2px}
.set-btn{flex-shrink:0;border:1.5px solid var(--flame);background:var(--surface);color:var(--flame-dark);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.set-btn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.set-test{width:100%;margin:-2px 0 8px;padding:10px;border-radius:var(--r2);border:1.5px dashed var(--border);background:transparent;color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer}
/* settings: the card that opens the gallery manager */
.gal-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font);text-align:right;cursor:pointer}
.gal-ico{width:42px;height:42px;border-radius:12px;background:var(--flame-bg);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.gal-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gal-txt b{font-size:14px}
.gal-txt small{font-size:12px;color:var(--text2)}
.gal-card svg{flex:none;color:var(--text2)}

/* the gallery manager: a full screen of its own */
.media-video{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;color:#fff;background:radial-gradient(circle at 50% 40%,#4A2E1C,#1A100A)}
.media-video small{font-size:11px;font-weight:700}
.media-yt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:31px;border-radius:9px;background:#C4302B;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cap-count{font-size:11px;color:var(--text2);text-align:left;margin-top:4px;direction:ltr}
.gm{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.gm-top{flex:none;background:linear-gradient(135deg,var(--char),#3A2113);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.gm-top.sel{background:var(--flame-dark)}
.gm-top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.gm-top h3{flex:1;min-width:0;font-family:var(--font-head);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-back{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:16px}
.gm-add{border:none;background:#C63F14;color:#fff;font-family:var(--font);font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:20px;cursor:pointer;flex:none;box-shadow:0 4px 14px rgba(216,72,27,.35)}
.gm-add:disabled{opacity:.5}
.gm-add.big{margin-top:10px;padding:12px 28px;font-size:14.5px}
.gm-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.gm-in{max-width:760px;margin:0 auto;padding:14px 14px 32px}
.gm-info{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.gm-stats{font-size:13px;font-weight:700}
.gm-view{font-size:12.5px;font-weight:700;color:var(--flame-dark);text-decoration:none;padding:6px 12px;border-radius:16px;background:var(--flame-bg)}
.gm-tip{flex-basis:100%;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11.5px;color:var(--text2);line-height:1.5}
.gm-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-top:12px;padding:2px 10px 10px}
.gm-sec.none{border-color:#E4C68E;background:var(--warn-bg)}
.gm-head{display:flex;align-items:center;gap:4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gm-fold{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;padding:10px 2px;cursor:pointer;color:var(--text);font-family:var(--font);text-align:right;touch-action:manipulation}
.gm-fold svg{flex:none;color:var(--text2);transition:transform .2s}
.gm-sec.closed .gm-fold svg{transform:rotate(90deg)}
.gm-name{font-weight:800;font-size:15px;color:var(--flame-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gm-sec.none .gm-name{color:var(--text)}
.gm-count{flex:none;font-size:11.5px;font-weight:700;color:var(--text2);background:var(--surface2);border-radius:10px;padding:1px 8px}
.gm-more{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:var(--text2);font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.gm-selall{flex:none;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:700;padding:6px 11px;border-radius:16px;cursor:pointer}
.gm-none-tip{font-size:11.5px;color:var(--text2);margin:-4px 2px 8px;line-height:1.45}
.gm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media(min-width:560px){.gm-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:720px){.gm-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.gm-sec.closed .gm-grid,.gm-sec.closed .gm-none-tip{display:none}
.gm-tile{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--surface2);border:none;padding:0;cursor:pointer;font-family:var(--font);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.gm-tile img,.gm-tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyA5Qp3W1dcpd4ncnTyB68nMueXtHbAoLAk",

let _fb=null;
async function fbInit(){
  if(_fb)return _fb;
  const appMod=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
  const fsMod=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
  const authMod=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js");
  const app=appMod.initializeApp(firebaseConfig);
  const db=fsMod.getFirestore(app);
  const auth=authMod.getAuth(app);
  _fb={db,doc:fsMod.doc,getDoc:fsMod.getDoc,setDoc:fsMod.setDoc,updateDoc:fsMod.updateDoc,deleteDoc:fsMod.deleteDoc,addDoc:fsMod.addDoc,
    onSnapshot:fsMod.onSnapshot,collection:fsMod.collection,query:fsMod.query,orderBy:fsMod.orderBy,deleteField:fsMod.deleteField,
    auth,onAuthStateChanged:authMod.onAuthStateChanged,signOut:authMod.signOut,
    googleSignIn:()=>authMod.signInWithPopup(auth,new authMod.GoogleAuthProvider())};
  return _fb;
}
// Firebase Storage holds the gallery's uploaded photos and videos (loaded only when the gallery needs it)
let _st=null;
async function fbStorage(){
  if(_st) return _st;
  await fbInit();
  const appMod=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
  const m=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js");
  _st={storage:m.getStorage(appMod.getApp()), ref:m.ref, uploadBytesResumable:m.uploadBytesResumable,
    getDownloadURL:m.getDownloadURL, getMetadata:m.getMetadata, deleteObject:m.deleteObject};
  return _st;
}
const LEVELS = ['CLASIC','SPECIAL','CRAZY'];
const LEVEL_ICON = {'CLASIC':'🔥','SPECIAL':'🔥🔥','CRAZY':'👑'};
const LEVEL_PRICE = {'CLASIC':170,'SPECIAL':220,'CRAZY':300};

/* ===== auth: Google sign-in; the Firestore rules decide who is an admin ===== */
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let adminEmails=[];   // added admins (mangalSettings/admins); the owners are written in the rules
let currentEmail='';
const lockErr=(msg)=>{ const e=document.getElementById('lockErr'); e.textContent=msg; e.style.display=msg?'block':'none'; };
async function initLock(){
  try{
    const {auth,onAuthStateChanged}=await fbInit();
    const user=await new Promise(res=>{ const off=onAuthStateChanged(auth,u=>{ off(); res(u); }); });
    if(!user){ renderLoginForm(); return; }
    if(!(await checkAccess(user))) return;
    if(localStorage.getItem('mangalBiometricCredId') && window.PublicKeyCredential) renderBiometricLock();
    else unlockApp();
  }catch(err){
    console.error(err);
    renderLoadError(err);
  }
}
// the admins list is readable only by admins, so reading it is the access check
async function checkAccess(user){
  const {db,doc,getDoc,auth,signOut}=await fbInit();
  try{
    const snap=await getDoc(doc(db,'mangalSettings','admins'));
    adminEmails=snap.exists() ? (snap.data().emails||[]) : [];
    currentEmail=(user.email||'').toLowerCase();
    // leftover from the old shared-password login (held the password hash)
    const {deleteDoc}=await fbInit();
    deleteDoc(doc(db,'mangalSettings','admin')).catch(()=>{});
    return true;
  }catch(e){
    if(e.code!=='permission-denied') throw e;
    await signOut(auth);
    renderLoginForm();
    lockErr(`החשבון ${user.email||''} לא מורשה לניהול. אפשר לבקש מבעלי העסק להוסיף אותו בהגדרות.`);
    return false;
  }
}
function renderLoadError(err){
  document.getElementById('lockTitle').textContent='לא הצליח להתחבר';
  document.getElementById('lockSub').textContent='נכשל החיבור למסד הנתונים. בדקו את החיבור לאינטרנט ונסו שוב.';
  document.getElementById('lockBody').innerHTML=`
    <div style="font-size:11px;color:var(--text3);direction:ltr;text-align:left;background:var(--bg);border-radius:8px;padding:8px;margin-bottom:10px;word-break:break-all">${esc(err&&err.message||String(err))}</div>
    <button class="main" onclick="location.reload()">ניסיון חדש</button>`;
}
const SITE_DOMAIN=location.hostname;
function authErrorText(err){
  const code=err&&err.code||'';
  if(code==='auth/operation-not-allowed') return 'צריך להפעיל ב-Firebase כניסה עם Google: Authentication ← Sign-in method ← Google ← Enable, ואז לנסות שוב.';
  if(code==='auth/unauthorized-domain') return `צריך לאשר את כתובת האתר ב-Firebase: Authentication ← Settings ← Authorized domains ← Add domain ← ${SITE_DOMAIN}`;
  if(code==='auth/popup-blocked') return 'הדפדפן חסם את חלון הכניסה. אפשרו חלונות קופצים לאתר ונסו שוב';
  if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request') return 'חלון הכניסה נסגר לפני שהכניסה הסתיימה';
  if(code==='auth/network-request-failed') return 'אין חיבור לאינטרנט';
  return 'הכניסה נכשלה: '+(err&&err.message||err);
}
const GOOGLE_ICON='<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
const googleBtn=(id,label,onclick)=>`<button class="main google-btn" id="${id}" onclick="${onclick}">${GOOGLE_ICON}<span>${label}</span></button>`;
function renderLoginForm(){
  document.getElementById('lockTitle').textContent='ניהול BBQ';
  document.getElementById('lockSub').textContent='כניסה עם חשבון Google מורשה';
  document.getElementById('lockBody').innerHTML=googleBtn('liBtn','כניסה עם Google','doLogin()');
}
async function doLogin(){
  lockErr('');
  const btn=document.getElementById('liBtn'); btn.disabled=true;
  try{
    const {googleSignIn}=await fbInit();
    const cred=await googleSignIn();
    if(await checkAccess(cred.user)) unlockApp();
  }catch(e){
    console.error(e); lockErr(authErrorText(e));
    const b=document.getElementById('liBtn'); if(b) b.disabled=false;
  }
}
function renderBiometricLock(){
  document.getElementById('lockTitle').textContent='ניהול BBQ';
  document.getElementById('lockSub').textContent='הניהול נעול';
  document.getElementById('lockBody').innerHTML=`
    <button id="biometricBtn" class="main" style="background:var(--char);margin-bottom:10px" onclick="doBiometricUnlock()">👆 פתיחה עם טביעת אצבע</button>
    <button class="link-btn" onclick="renderLoginForm()">כניסה עם Google</button>`;
  setTimeout(()=>doBiometricUnlock(),300);
}
async function idToken(){
  const {auth}=await fbInit();
  return auth.currentUser ? auth.currentUser.getIdToken() : '';
}

/* ===== biometric (WebAuthn) ===== */
function _ab2b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function _b642ab(b64){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr.buffer;}
async function registerBiometric(){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'BBQ',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'admin',displayName:'מנהל'},
      pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000
    }});
    localStorage.setItem('mangalBiometricCredId',_ab2b64(cred.rawId));
    return true;
  }catch(e){ console.error(e); return false; }
}
async function tryBiometric(){
  const b64=localStorage.getItem('mangalBiometricCredId');
  if(!b64||!window.PublicKeyCredential) return false;
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{id:_b642ab(b64),type:'public-key'}],
      userVerification:'required',
      timeout:60000
    }});
    return true;
  }catch(e){ return false; }
}
async function doBiometricUnlock(){
  const btn=document.getElementById('biometricBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ מאמת...';}
  const ok=await tryBiometric();
  if(ok){ unlockApp(); }
  else if(btn){btn.disabled=false;btn.textContent='👆 כניסה עם טביעת אצבע';}
}
async function toggleBiometricSetting(){
  const has=!!localStorage.getItem('mangalBiometricCredId');
  if(has){
    if(!confirm('לבטל כניסה עם טביעת אצבע?')) return;
    localStorage.removeItem('mangalBiometricCredId');
    showToast('טביעת אצבע בוטלה');
  } else {
    if(!window.PublicKeyCredential){ showToast('הדפדפן לא תומך בטביעת אצבע'); return; }
    const ok=await registerBiometric();
    showToast(ok?'טביעת אצבע הופעלה ✓':'ההפעלה נכשלה או בוטלה');
  }
  updateBioBtn();
}
function updateBioBtn(){
  const btn=document.getElementById('bioBtn');
  if(!btn) return;
  const has=!!localStorage.getItem('mangalBiometricCredId');
  btn.textContent = has ? 'פעיל ✓' : 'הפעלה';
  btn.classList.toggle('on', has);
}
function unlockApp(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('app').style.display='block';
  if(location.hash==='#pending') setTab('pending');
  startListening();
  syncPushSubscription();
}

/* ===== data ===== */
let bookings=[];
let knownPendingIds=new Set();
let firstLoad=true;

async function startListening(){
  const {db,collection,query,orderBy,onSnapshot}=await fbInit();
  const q=query(collection(db,'mangalBookings'), orderBy('date','asc'));
  onSnapshot(q, (snap)=>{
    bookings=snap.docs.map(d=>({id:d.id,...d.data()}));
    checkNewPending();
    renderAll();
    syncReminders();
  }, (err)=>{
    console.error(err);
  });
}
// The day-before reminder push (api/reminders.js) reads mangalSettings/reminders, which is readable
// without signing in, so it holds only the approved upcoming events' date, time, size and level.
let lastReminders=null;
async function syncReminders(){
  const d=new Date(), today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const events=bookings.filter(b=>b.status==='approved' && b.date>=today)
    .map(b=>({date:b.date, washTime:b.washTime||null, guests:Number(b.guests||0), level:b.level||null}));
  const json=JSON.stringify(events);
  if(json===lastReminders) return;
  lastReminders=json;
  try{
    const {db,doc,setDoc}=await fbInit();
    await setDoc(doc(db,'mangalSettings','reminders'),{events});
  }catch(e){ lastReminders=null; console.error('reminders sync',e); }
}
function checkNewPending(){

    if(newOnes.length){

      if(!pushActive && typeof Notification!=='undefined' && Notification.permission==='granted'){

function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
    o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.4);
  }catch(e){}
}

let pushActive=false;

async function currentPushSub(){

async function pushSubId(endpoint){ return 's'+(await sha256(endpoint)).slice(0,24); }
function urlB64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}

        await sub.unsubscribe();

  if(perm!=='granted'){ showToast('ההתראות לא אושרו. אפשר לאשר אותן בהגדרות הדפדפן'); return; }
  try{

    await savePushSub(sub);

let calMonth=new Date(); calMonth.setDate(1); // anchor for gregorian mode (first-of-month)
let calHebrewAnchor=new Date(); // any date inside the currently shown hebrew month

const _heDayFmt=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric'});
const _heMonthFmt=new Intl.DateTimeFormat('he-u-ca-hebrew',{month:'long'});
const _heYearFmt=new Intl.DateTimeFormat('he-u-ca-hebrew',{year:'numeric'});
/* Hebrew numeral (gematria) letters for a plain number, e.g. 17 -> י״ז, 5787 -> תשפ״ז
   (thousands dropped per the usual year-writing convention; 15/16 use ט״ו/ט״ז to
   avoid spelling the letter-combinations that resemble God's name) */
function hebrewNumeral(num){
  const map=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  let rem=num%1000;
  if(rem===0) rem=num;
  let letters='';
  while(rem>0){
    if(rem===15){ letters+='טו'; break; }
    if(rem===16){ letters+='טז'; break; }
    const hit=map.find(([val])=>rem>=val);
    if(!hit) break;
    letters+=hit[1]; rem-=hit[0];
  }
  if(!letters) return String(num);
  return letters.length>1 ? letters.slice(0,-1)+'״'+letters.slice(-1) : letters+'׳';
}
function heMonthKey(date){ return _heMonthFmt.format(date)+' '+_heYearFmt.format(date); }
/* scans day-by-day (a hebrew month is at most 30 days) to find the Gregorian
   start/end dates of the hebrew month containing `anchor` - Intl only converts
   gregorian->hebrew, not the other way, so this is the simple robust way to
   find hebrew month boundaries */
function hebrewMonthBounds(anchor){
  const key=heMonthKey(anchor);
  let start=new Date(anchor);
  while(true){
    const prev=new Date(start); prev.setDate(prev.getDate()-1);
    if(heMonthKey(prev)!==key) break;
    start=prev;
  }
  let end=new Date(anchor);
  while(true){
    const next=new Date(end); next.setDate(next.getDate()+1);
    if(heMonthKey(next)!==key) break;
    end=next;
  }
  return {start,end};
}
function setCalMode(mode){
  calMode=mode;
  try{ localStorage.setItem('mangalCalMode',mode); }catch(e){}
  renderCalendar();
}
function calToday(){
  if(calMode==='hebrew') calHebrewAnchor=new Date();
  else { calMonth=new Date(); calMonth.setDate(1); }
  renderCalendar();
}
function calShift(dir){
  if(calMode==='hebrew'){
    const {start,end}=hebrewMonthBounds(calHebrewAnchor);
    const next=new Date(dir>0?end:start);
    next.setDate(next.getDate()+dir);
    calHebrewAnchor=next;
  } else {
    calMonth.setMonth(calMonth.getMonth()+dir);
  }
  renderCalendar();
}
function renderCalendar(){
  const el=document.getElementById('boardCalendarWrap');

  });

  let title, subtitle, startWeekday, daysCount, cellDate;
  if(calMode==='hebrew'){
    const {start,end}=hebrewMonthBounds(calHebrewAnchor);
    daysCount=Math.round((end-start)/86400000)+1;
    startWeekday=start.getDay();
    title=`${_heMonthFmt.format(start)} ${hebrewNumeral(parseInt(_heYearFmt.format(start),10))}`;
    const sameGregMonth = start.getMonth()===end.getMonth() && start.getFullYear()===end.getFullYear();
    subtitle = sameGregMonth
      ? start.toLocaleDateString('he-IL',{month:'long',year:'numeric'})
      : `${start.toLocaleDateString('he-IL',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'})}`;
    cellDate=(i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; };
  } else {
    const y=calMonth.getFullYear(), m=calMonth.getMonth();
    daysCount=new Date(y,m+1,0).getDate();

    title=calMonth.toLocaleDateString('he-IL',{month:'long',year:'numeric'});

  }

  let cells='';
  for(let i=0;i<startWeekday;i++) cells+=`<div class="cal-cell cal-blank"></div>`;
  for(let i=0;i<daysCount;i++){
    const d=cellDate(i);
    const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const evs=byDay[dateStr]||[];

    cells+=`<div class="cal-cell ${evs.length?'has-events':''} ${dateStr===todayStr?'today':''}" ${evs.length?`onclick="openDayEvents('${dateStr}')"`:''}>

  }

  el.innerHTML=`

        <button class="${calMode==='hebrew'?'on':''}" onclick="setCalMode('hebrew')">עברי</button>
        <button class="${calMode==='gregorian'?'on':''}" onclick="setCalMode('gregorian')">לועזי</button>
      </div>

    </div>
    <div class="cal-hdr">
      <button class="cal-nav" onclick="calShift(-1)">‹ הקודם</button>
      <div>
        <div class="cal-title">${title}</div>
        ${subtitle?`<div class="cal-subtitle">${subtitle}</div>`:''}
      </div>
      <button class="cal-nav" onclick="calShift(1)">הבא ›</button>
    </div>
    <div class="cal-grid cal-weekdays">${['א','ב','ג','ד','ה','ו','ש'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}

/* ===== the phone's back button: one step back through the windows =====
   The windows in #modalRoot replace each other (calendar day → event details → edit), so every step is
   kept: back shows the previous window, and from the first one returns to the board. In the gallery
   manager, a small window (edit, add, category) and selecting photos are steps of their own. Each open
   step has one history entry; closing windows with ✕ / saving / tapping outside removes their entries,
   so back never gets stuck on a closed window. */
const viewStack=[];
let restoringView=false, backDepth=0, skipPops=0;
function viewOpened(redo){
  if(restoringView) return;
  if(!document.getElementById('modalRoot').innerHTML.trim()) viewStack.length=0;
  viewStack.push(redo);
  history.pushState({bbqAdmin:true},''); backDepth++;
}
function openSteps(){ return (document.getElementById('modalRoot').innerHTML.trim()?viewStack.length:0)+(sheetOpen()?1:0)+(gmSel&&gmIsOpen()?1:0); }
function syncBackHistory(){
  // after the current click is handled, so a window opened right after this one keeps its entry
  setTimeout(()=>{
    const extra=backDepth-openSteps();
    if(extra>0){ backDepth-=extra; skipPops++; history.go(-extra); }
  },0);
}
addEventListener('popstate',()=>{
  if(skipPops){ skipPops--; return; }
  if(backDepth<=0) return;
  backDepth--;
  if(sheetOpen()){ closeSheet(); return; }
  if(gmSel){ gmSel=null; renderGalleryManager(); return; }
  viewStack.pop();
  if(viewStack.length){ restoringView=true; try{ viewStack[viewStack.length-1](); } finally{ restoringView=false; } }
  else closeModal();
});

let galleryItems=null;

// gallery groups: a photo with no group shows on the site under "כללי"
const DEFAULT_GROUP='כללי';
const GROUP_MAX=40;
let lastUploadGroup='';
function itemGroup(g){ return (g && g.group || '').trim(); }
function groupNames(){
  const out=[];
  (galleryItems||[]).forEach(g=>{ const n=itemGroup(g)||DEFAULT_GROUP; if(!out.includes(n)) out.push(n); });
  return out;
}
// a new photo goes first in its own group (so the order of the groups on the site stays); a new group goes last
function withNewItem(items,item){
  const n=itemGroup(item)||DEFAULT_GROUP;
  const idx=items.findIndex(g=>(itemGroup(g)||DEFAULT_GROUP)===n);
  const out=items.slice();
  if(idx<0) out.push(item); else out.splice(idx,0,item);
  return out;
}

// looks up a file that isn't there: "not found" means the storage is on and its rules are published
async function checkStorage(){
  let reason='';
  try{
    const st=await fbStorage();
    await st.getMetadata(st.ref(st.storage,'gallery/0-probe.jpg'));
  }catch(e){ if(e.code!=='storage/object-not-found') reason=storageProblem(e); }
  storageReady=!reason;
  storageReason=reason;
  renderStorageNote();
}
function storageProblem(e){
  const code=e&&e.code||'';
  if(code==='storage/unauthorized') return 'אין הרשאה. צריך להדביק את חוקי האחסון (storage.rules) ב-Firebase ← Storage ← Rules';
  if(code==='storage/retry-limit-exceeded' || !navigator.onLine) return 'אין חיבור לאינטרנט';
  return `האחסון של Firebase עוד לא הופעל (Storage ← Get started)${code?` [${code}]`:''}`;
}
let storageReason='';
function renderStorageNote(){
  const note=document.getElementById('storageNote');
  if(note) note.innerHTML = storageReady||!storageReason ? '' :
    `<div class="minfo">אי אפשר להעלות קבצים כרגע: ${esc(storageReason)}. עריכה, סידור ומחיקה עובדים גם בלי זה.</div>`;
}
async function loadGalleryItems(){
  galleryLoading=true;
  renderGalleryManager();
  try{
    const {db,doc,getDoc}=await fbInit();
    const snap=await getDoc(doc(db,'mangalSettings','gallery'));
    galleryItems = snap.exists() && Array.isArray(snap.data().items)
      ? snap.data().items.filter(g=>isSafeMediaUrl(g.url))
      : [];
  }catch(e){ console.error(e); galleryItems=null; }
  galleryLoading=false;
  renderGalleryManager();
}
async function saveGalleryItems(items){
  // update memory first so an upload finishing mid-save builds on the latest list
  galleryItems=items;
  renderGalleryManager();
  const {db,doc,setDoc}=await fbInit();
  await setDoc(doc(db,'mangalSettings','gallery'),{items, updatedAtMs:Date.now()});
}
// the gallery split into its groups, in the order they show on the site (a group's first photo decides its place)
function mediaGroups(){
  const out=[];
  (galleryItems||[]).forEach((g,i)=>{
    const n=itemGroup(g)||DEFAULT_GROUP;
    let grp=out.find(x=>x.name===n);
    if(!grp){ grp={name:n, idx:[]}; out.push(grp); }
    grp.idx.push(i);
  });
  return out;
}
// the list stored group after group, which is the order the site shows
function flattenGroups(items){
  const order=[], map={};
  items.forEach(g=>{ const n=itemGroup(g)||DEFAULT_GROUP; if(!map[n]){ map[n]=[]; order.push(n); } map[n].push(g); });
  return order.flatMap(n=>map[n]);
}
function mediaThumb(g){
  return g.kind==='video'
    ? `<div class="media-video" aria-hidden="true">▶<small>סרטון</small></div>`
    : g.kind==='youtube'
    ? `<img src="${esc(YT.thumb(g.url))}" alt="" loading="lazy" draggable="false"><span class="media-yt" aria-hidden="true">▶</span>`
    : `<img src="${esc(g.url)}" alt="" loading="lazy" draggable="false">`;
}
const countOf=(n,one,many)=>n===1?one:`${n} ${many}`;

/* ===== the gallery manager: a full screen of its own, opened from the settings =====
   Categories in the order the site shows them. A long press lifts a photo or a category for dragging;
   letting go without moving starts selecting photos, to move or delete several together. */
const NO_GROUP_LABEL='בלי קטגוריה';
const ICON_BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const ICON_FOLD='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
let galleryLoading=false;
let gmCollapsed=new Set();  // categories folded to their title
let gmSel=null;             // while selecting: the selected items' urls
let gmUp=null;              // the upload in progress
let gmErrors=[];            // problems from the last upload
function gmIsOpen(){ return !!document.getElementById('gmList'); }
function renderGalleryCard(){
  const el=document.getElementById('galleryCardInfo');
  if(!el) return;
  el.textContent = galleryItems===null
    ? (galleryLoading?'טוען...':'לא הצליח לטעון')
    : galleryItems.length
      ? `${countOf(galleryItems.length,'פריט אחד','פריטים')} · ${countOf(mediaGroups().length,'קטגוריה אחת','קטגוריות')}`
      : 'עוד אין תמונות באתר';
}
function openGalleryManager(){
  viewOpened(openGalleryManager);
  gmSel=null;
  document.getElementById('modalRoot').innerHTML=`
    <div class="gm" role="dialog" aria-modal="true" aria-labelledby="gmTitle">
      <div class="gm-top" id="gmTop"></div>
      <div class="gm-body" id="gmBody">
        <div class="gm-in">
          <div class="gm-info" id="gmInfo"></div>
          <div id="storageNote"></div>
          <div id="gmUpload"></div>
          <div id="gmList"></div>
        </div>
      </div>
      <div class="gm-actions" id="gmActions" hidden></div>
    </div>`;
  renderGalleryManager();
  renderStorageNote();
  if(galleryItems===null && !galleryLoading) loadGalleryItems();
  checkStorage();
}
// back to the settings from the manager's own back button
function backToPrevView(){
  viewStack.pop();
  if(!viewStack.length){ closeModal(); return; }
  restoringView=true; try{ viewStack[viewStack.length-1](); } finally{ restoringView=false; }
  syncBackHistory();
}
function renderGalleryManager(){
  renderGalleryCard();
  if(!gmIsOpen()) return;
  if(gmDrag){ gmDrag.renderLater=true; return; }
  const ready=Array.isArray(galleryItems);
  const top=document.getElementById('gmTop');
  top.classList.toggle('sel',!!gmSel);
  top.innerHTML=`<div class="gm-top-in">${gmSel ? `
    <button type="button" class="gm-back" onclick="exitSelect()" aria-label="ביטול הבחירה">✕</button>
    <h3 id="gmTitle">${gmSel.size?`נבחרו ${gmSel.size}`:'בחירת פריטים'}</h3>` : `
    <button type="button" class="gm-back" onclick="backToPrevView()" aria-label="חזרה להגדרות">${ICON_BACK}</button>
    <h3 id="gmTitle">הגלריה באתר</h3>
    <button type="button" class="gm-add" onclick="openAddSheet()" ${ready?'':'disabled'}>＋ הוספה</button>`}</div>`;
  const act=document.getElementById('gmActions');
  act.hidden=!gmSel;
  act.innerHTML = gmSel ? `
    <button type="button" class="gm-act" onclick="openMoveSheet()" ${gmSel.size?'':'disabled'}>📁 העברה לקטגוריה</button>
    <button type="button" class="gm-act danger" onclick="deleteSelected()" ${gmSel.size?'':'disabled'}>🗑️ מחיקה</button>` : '';
  const info=document.getElementById('gmInfo');
  if(!ready || !galleryItems.length) info.innerHTML='';
  else if(gmSel) info.innerHTML=`<p class="gm-tip">לחיצה על פריטים לבחירה, ואז בוחרים מה לעשות איתם למטה</p>`;
  else {
    const vids=galleryItems.filter(g=>g.kind!=='image').length;
    info.innerHTML=`
      <div class="gm-stats">${countOf(galleryItems.length-vids,'תמונה אחת','תמונות')} · ${countOf(vids,'סרטון אחד','סרטונים')} · ${countOf(mediaGroups().length,'קטגוריה אחת','קטגוריות')}</div>
      <a class="gm-view" href="/#gallery" target="_blank" rel="noopener">👁 איך זה נראה באתר</a>
      <p class="gm-tip"><span>✏️ לחיצה: עריכה</span><span>↕️ לחיצה ארוכה וגרירה: שינוי סדר</span><span>☑️ לחיצה ארוכה: בחירת כמה</span></p>`;
  }
  renderUploadPanel();
  const list=document.getElementById('gmList');
  if(!ready){
    list.innerHTML = galleryLoading
      ? `<div class="empty">טוען...</div>`
      : `<div class="empty">לא הצליח לטעון את הגלריה<br><button type="button" class="gm-retry" onclick="loadGalleryItems()">לנסות שוב</button></div>`;
    return;
  }
  if(!galleryItems.length){
    list.innerHTML=`<div class="gm-empty"><div class="gm-empty-ico" aria-hidden="true">📷</div><b>עוד אין תמונות באתר</b>
      <span>אפשר להוסיף תמונות וסרטונים מהטלפון, או קישור לסרטון מיוטיוב</span>
      <button type="button" class="gm-add big" onclick="openAddSheet()">＋ הוספה</button></div>`;
    return;
  }
  list.innerHTML=mediaGroups().map(gmSectionHtml).join('');
}
function gmSectionHtml(grp){
  const none = grp.name===DEFAULT_GROUP && grp.idx.some(i=>!itemGroup(galleryItems[i]));
  const label = none ? NO_GROUP_LABEL : grp.name;
  const closed = gmCollapsed.has(grp.name);
  const allSel = gmSel && grp.idx.every(i=>gmSel.has(galleryItems[i].url));
  return `
    <section class="gm-sec ${none?'none':''} ${closed?'closed':''}" data-group="${esc(grp.name)}">
      <div class="gm-head">
        <button type="button" class="gm-fold" onclick="toggleGroupFold(this)" aria-expanded="${!closed}">
          ${ICON_FOLD}<span class="gm-name">${none?'⚠️ ':''}${esc(label)}</span><span class="gm-count">${grp.idx.length}</span>
        </button>
        ${gmSel
          ? `<button type="button" class="gm-selall" onclick="selectGroup(this)">${allSel?'ביטול הבחירה':'בחירת הכל'}</button>`
          : `<button type="button" class="gm-more" onclick="openGroupSheet(this.closest('.gm-sec').dataset.group)" aria-label="אפשרויות לקטגוריה ${esc(label)}">⋯</button>`}
      </div>
      ${none?`<p class="gm-none-tip">באתר הן מופיעות תחת "כללי". אפשר לגרור אותן לקטגוריה, או ⋯ לקביעת קטגוריה לכולן.</p>`:''}
      <div class="gm-grid">${grp.idx.map(i=>gmTileHtml(galleryItems[i])).join('')}</div>
    </section>`;
}
function gmTileHtml(g){
  const sel = gmSel && gmSel.has(g.url);
  return `
        <button type="button" class="gm-tile ${sel?'sel':''}" data-url="${esc(g.url)}" onclick="tileTap(this)"
          aria-label="${g.kind==='image'?'תמונה':'סרטון'}${g.cap?': '+esc(g.cap):''}" ${gmSel?`aria-pressed="${!!sel}"`:''}>
          ${mediaThumb(g)}
          ${g.cap?`<span class="gm-cap" aria-hidden="true">${esc(g.cap)}</span>`:''}
          ${gmSel?`<span class="gm-check" aria-hidden="true">${sel?'✓':''}</span>`:''}
        </button>`;
}
function tileTap(btn){
  const url=btn.dataset.url;
  if(!gmSel){ openItemSheet(url); return; }
  if(gmSel.has(url)) gmSel.delete(url); else gmSel.add(url);
  renderGalleryManager();
}
function toggleGroupFold(btn){
  const sec=btn.closest('.gm-sec'), name=sec.dataset.group;
  const closed=!sec.classList.contains('closed');
  sec.classList.toggle('closed',closed);
  btn.setAttribute('aria-expanded',String(!closed));
  if(closed) gmCollapsed.add(name); else gmCollapsed.delete(name);
}
function groupUrls(name){ return (galleryItems||[]).filter(g=>(itemGroup(g)||DEFAULT_GROUP)===name).map(g=>g.url); }

/* selecting several items; the phone's back button ends it */
function enterSelect(urls){
  if(gmSel) return;
  gmSel=new Set(urls);
  history.pushState({bbqAdmin:true},''); backDepth++;
  renderGalleryManager();
}
function exitSelect(){
  if(!gmSel) return;
  gmSel=null;
  renderGalleryManager();
  syncBackHistory();
}
function selectGroup(btn){
  const urls=groupUrls(btn.closest('.gm-sec').dataset.group);
  const all=urls.every(u=>gmSel.has(u));
  urls.forEach(u=>all?gmSel.delete(u):gmSel.add(u));
  renderGalleryManager();
}
function openMoveSheet(){
  if(!gmSel || !gmSel.size) return;
  openSheet(`📁 העברת ${countOf(gmSel.size,'פריט אחד','פריטים')}`, `
    ${catPicker(null)}
    <div class="modal-actions"><button type="button" class="btn-save" onclick="moveSelected()">העברה</button></div>`);
}
async function moveSelected(){
  if(!gmSel || !galleryItems) return;
  const group=catValue();
  if(group===null){ showToast('בחרו קטגוריה'); return; }
  const urls=[...gmSel];
  const moved=galleryItems.filter(g=>urls.includes(g.url)).map(g=>({...g,group}));
  const rest=galleryItems.filter(g=>!urls.includes(g.url));
  // the moved items go to the end of their category; a new category goes last
  let at=-1;
  rest.forEach((g,i)=>{ if((itemGroup(g)||DEFAULT_GROUP)===(group||DEFAULT_GROUP)) at=i; });
  const items = at<0 ? [...rest,...moved] : [...rest.slice(0,at+1),...moved,...rest.slice(at+1)];
  closeSheet(); exitSelect();
  try{
    await saveGalleryItems(flattenGroups(items));
    showToast(`${countOf(moved.length,'פריט אחד הועבר','פריטים הועברו')} ל${group?`"${group}"`:NO_GROUP_LABEL} ✓`);
  }catch(e){ console.error(e); showToast('ההעברה נכשלה'); loadGalleryItems(); }
}
async function deleteSelected(){
  if(!gmSel || !gmSel.size) return;
  const urls=[...gmSel];
  if(!confirm(`למחוק ${countOf(urls.length,'פריט אחד','פריטים')} מהאתר?`)) return;
  exitSelect();
  if(await removeItems(urls)) showToast(urls.length===1?'נמחק מהאתר ✓':`${urls.length} פריטים נמחקו מהאתר ✓`);
}
async function removeItems(urls){
  const gone=galleryItems.filter(g=>urls.includes(g.url));
  try{
    await saveGalleryItems(galleryItems.filter(g=>!urls.includes(g.url)));
  }catch(e){ console.error(e); showToast('המחיקה נכשלה'); loadGalleryItems(); return false; }
  const stored=gone.filter(g=>g.path);
  if(stored.length){
    const st=await fbStorage();
    stored.forEach(g=>st.deleteObject(st.ref(st.storage,g.path)).catch(e=>console.error(e)));
  }
  const blobs=gone.filter(g=>g.blob);
  if(blobs.length){
    const token=await idToken();
    blobs.forEach(g=>fetch('/api/media-delete',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({url:g.url,idToken:token})}).catch(()=>{}));
  }
  return true;
}

/* ===== small windows over the manager (edit, add, category); each is one step for the back button ===== */
function sheetOpen(){ const r=document.getElementById('sheetRoot'); return !!(r && r.innerHTML.trim()); }
function openSheet(title, body){
  let root=document.getElementById('sheetRoot');
  if(!root){ root=document.createElement('div'); root.id='sheetRoot'; document.body.appendChild(root); }
  const wasOpen=sheetOpen();
  root.innerHTML=`
    <div class="modal-bg sheet-bg" onclick="if(event.target===this)closeSheet()">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="modal-top"><h3 id="sheetTitle">${title}</h3><button type="button" class="modal-close" onclick="closeSheet()" aria-label="סגירה">✕</button></div>
        ${body}
      </div>
    </div>`;
  if(!wasOpen){ history.pushState({bbqAdmin:true},''); backDepth++; }
  return root;
}
function closeSheet(){
  const root=document.getElementById('sheetRoot');
  if(root){ root.innerHTML=''; delete root.dataset.url; delete root.dataset.group; }
  clearPending();
  syncBackHistory();
}
// choosing a category: one of the existing ones, none, or a new name. cur=null starts with nothing chosen
function catPicker(cur){
  if(cur!==null){ cur=(cur||'').trim(); if(cur===DEFAULT_GROUP) cur=''; }
  const names=groupNames().filter(n=>n!==DEFAULT_GROUP);
  return `
    <div class="mfld">
      <label for="catInput">קטגוריה</label>
      <div class="grp-chips" id="catChips" data-picked="${cur===null?'':'1'}">
        ${names.map(n=>`<button type="button" class="grp-chip ${n===cur?'on':''}" data-v="${esc(n)}" onclick="pickCat(this)">${esc(n)}</button>`).join('')}
        <button type="button" class="grp-chip none ${cur===''?'on':''}" data-v="" onclick="pickCat(this)">${NO_GROUP_LABEL}</button>
      </div>
      <input class="cat-new" id="catInput" type="text" maxlength="${GROUP_MAX}" value="${esc(cur||'')}" placeholder="או שם לקטגוריה חדשה" oninput="syncCatChips(true)">
    </div>`;
}
function pickCat(btn){ document.getElementById('catInput').value=btn.dataset.v; syncCatChips(true); }
function syncCatChips(picked){
  const box=document.getElementById('catChips');
  if(picked) box.dataset.picked='1';
  const v=document.getElementById('catInput').value.trim();
  box.querySelectorAll('.grp-chip').forEach(c=>c.classList.toggle('on',box.dataset.picked==='1' && c.dataset.v===v));
}
// the chosen category ('' = none), or null when nothing was chosen yet
function catValue(){
  const box=document.getElementById('catChips'), inp=document.getElementById('catInput');
  if(!box || !inp || box.dataset.picked!=='1') return null;
  const v=inp.value.trim().slice(0,GROUP_MAX);
  return v===DEFAULT_GROUP?'':v;
}

const CAPTION_MAX=80;
function openItemSheet(url){
  const item=galleryItems && galleryItems.find(g=>g.url===url);
  if(!item) return;
  const what=item.kind==='image'?'התמונה':'הסרטון';
  const root=openSheet(item.kind==='image'?'✏️ עריכת תמונה':'✏️ עריכת סרטון', `
    ${item.kind==='video'
      ? `<video class="sheet-prev" src="${esc(item.url)}" controls playsinline preload="none"></video>`
      : item.kind==='youtube'
      ? `<div class="sheet-yt"><img class="sheet-prev" src="${esc(YT.thumb(item.url))}" alt=""><span class="media-yt" aria-hidden="true">▶</span></div>`
      : `<img class="sheet-prev" src="${esc(item.url)}" alt="">`}
    <div class="mfld">
      <label for="capInput">כיתוב שיופיע על ${what} באתר</label>
      <input id="capInput" type="text" maxlength="${CAPTION_MAX}" value="${esc(item.cap||'')}" placeholder="למשל: אנטריקוט על האש באירוע בר מצווה"
        oninput="document.getElementById('capCount').textContent=this.value.length+'/${CAPTION_MAX}'"
        onkeydown="if(event.key==='Enter')saveItemSheet()">
      <div class="cap-count" id="capCount">${(item.cap||'').length}/${CAPTION_MAX}</div>
    </div>
    ${catPicker(itemGroup(item))}
    <div class="modal-actions"><button type="button" class="btn-save" onclick="saveItemSheet()">שמירה</button></div>
    <button type="button" class="sheet-del" onclick="deleteSheetItem()">🗑️ מחיקת ${what} מהאתר</button>`);
  root.dataset.url=url;
}
async function saveItemSheet(){
  const url=document.getElementById('sheetRoot').dataset.url;
  const item=galleryItems && galleryItems.find(g=>g.url===url);
  if(!item){ closeSheet(); return; }
  const cap=document.getElementById('capInput').value.trim().slice(0,CAPTION_MAX);
  const group=catValue();
  const updated={...item, cap, group:group===null?itemGroup(item):group};
  closeSheet();
  // moved to another category: first in it (a new category goes last)
  const items=(itemGroup(updated)||DEFAULT_GROUP)===(itemGroup(item)||DEFAULT_GROUP)
    ? galleryItems.map(g=>g.url===url?updated:g)
    : withNewItem(galleryItems.filter(g=>g.url!==url),updated);
  try{ await saveGalleryItems(items); showToast('נשמר ✓'); }
  catch(e){ console.error(e); showToast('השמירה נכשלה'); loadGalleryItems(); }
}
async function deleteSheetItem(){
  const url=document.getElementById('sheetRoot').dataset.url;
  const item=galleryItems && galleryItems.find(g=>g.url===url);
  if(!item) return;
  if(!confirm(item.kind==='image'?'למחוק את התמונה מהאתר?':'למחוק את הסרטון מהאתר?')) return;
  closeSheet();
  if(await removeItems([url])) showToast('נמחק מהאתר ✓');
}

// the ⋯ of a category (also a long press on its title)
function openGroupSheet(name){
  const urls=groupUrls(name);
  if(!urls.length) return;
  const none=name===DEFAULT_GROUP;
  const root=openSheet(`📁 ${esc(none?NO_GROUP_LABEL:name)} <span class="gm-count">${urls.length}</span>`, `
    <div class="mfld">
      <label for="grpName">${none?'קטגוריה לכל הפריטים כאן':'שם הקטגוריה'}</label>
      <input id="grpName" type="text" maxlength="${GROUP_MAX}" value="${none?'':esc(name)}" placeholder="${none?'למשל: בשרים על האש':''}" onkeydown="if(event.key==='Enter')renameGroup()">
    </div>
    <div class="modal-actions"><button type="button" class="btn-save" onclick="renameGroup()">${none?'שמירה':'שמירת השם'}</button></div>
    <div class="sheet-opts">
      <button type="button" class="sheet-opt" onclick="selectWholeGroup()">☑️ בחירת כל הפריטים כאן<small>להעברה או למחיקה של כולם ביחד</small></button>
      ${none?'':`<button type="button" class="sheet-opt danger" onclick="dissolveGroup()">🗑️ ביטול הקטגוריה<small>הפריטים נשארים באתר, בלי קטגוריה</small></button>`}
    </div>`);
  root.dataset.group=name;
}
async function renameGroup(){
  const name=document.getElementById('sheetRoot').dataset.group;
  let to=document.getElementById('grpName').value.trim().slice(0,GROUP_MAX);
  if(!to){ showToast('צריך לכתוב שם'); return; }
  if(to===DEFAULT_GROUP) to='';
  closeSheet();
  if(to===name) return;
  // same name as another category: they join it
  const items=flattenGroups(galleryItems.map(g=>(itemGroup(g)||DEFAULT_GROUP)===name?{...g,group:to}:g));
  try{ await saveGalleryItems(items); showToast('נשמר ✓'); }
  catch(e){ console.error(e); showToast('השמירה נכשלה'); loadGalleryItems(); }
}
function selectWholeGroup(){
  const name=document.getElementById('sheetRoot').dataset.group;
  closeSheet();
  gmCollapsed.delete(name);
  enterSelect(groupUrls(name));
}
async function dissolveGroup(){
  const name=document.getElementById('sheetRoot').dataset.group;
  if(!confirm(`לבטל את הקטגוריה "${name}"? הפריטים יישארו באתר, בלי קטגוריה.`)) return;
  closeSheet();
  const items=flattenGroups(galleryItems.map(g=>itemGroup(g)===name?{...g,group:''}:g));
  try{ await saveGalleryItems(items); showToast('הקטגוריה בוטלה ✓'); }
  catch(e){ console.error(e); showToast('השמירה נכשלה'); loadGalleryItems(); }
}

/* adding: files from the phone or a YouTube link */
let gmPending=null; // files chosen for upload, with a local preview
function openAddSheet(){
  if(!Array.isArray(galleryItems)){ showToast('הגלריה לא נטענה, נסו לפתוח שוב'); return; }
  openSheet('＋ הוספה לגלריה', `
    <div class="add-opts">
      <label class="add-opt ${storageReady?'':'disabled'}">
        <span class="ico" aria-hidden="true">📷</span>
        <span><b>תמונות וסרטונים מהטלפון</b><small>אפשר לבחור כמה ביחד · סרטון עד 500MB</small></span>
        <input type="file" accept="image/*,video/*" multiple hidden onchange="pickFiles(this.files)" ${storageReady?'':'disabled'}>
      </label>
      <button type="button" class="add-opt" onclick="openYoutubeSheet()">
        <span class="ico yt" aria-hidden="true">▶</span>
        <span><b>סרטון מיוטיוב</b><small>לסרטון שכבר נמצא ביוטיוב</small></span>
      </button>
    </div>
    ${storageReady?'':`<div class="minfo">${storageReason?`אי אפשר להעלות קבצים כרגע: ${esc(storageReason)}`:'בודק את האחסון...'}</div>`}`);
}
function pickFiles(fileList){
  const files=[...fileList];
  if(!files.length) return;
  clearPending();
  gmPending=files.map(file=>{
    const video=(file.type||guessMediaType(file.name)).startsWith('video/');
    return {file, video, big:video && file.size>MAX_VIDEO_BYTES, url:URL.createObjectURL(file)};
  });
  renderUploadSheet();
}
function clearPending(){
  if(gmPending) gmPending.forEach(p=>URL.revokeObjectURL(p.url));
  gmPending=null;
}
function renderUploadSheet(){
  const ok=gmPending.filter(p=>!p.big).length;
  const prev=catValue();
  openSheet('📷 העלאה לגלריה', `
    <div class="up-grid">${gmPending.map((p,k)=>`
      <div class="up-tile ${p.big?'big':''}">
        <span aria-hidden="true">${p.video?'🎬':'📷'}</span>
        ${p.video?`<video src="${p.url}" muted playsinline preload="metadata"></video><span class="up-kind" aria-hidden="true">🎬</span>`:`<img src="${p.url}" alt="" onerror="this.remove()">`}
        ${p.big?`<span class="up-warn">גדול מדי · ${Math.round(p.file.size/1048576)}MB</span>`:''}
        <button type="button" class="up-x" onclick="unpickFile(${k})" aria-label="להוציא מההעלאה">✕</button>
      </div>`).join('')}</div>
    ${gmPending.some(p=>p.big)?`<div class="minfo">סרטון מעל 500MB לא יועלה. אפשר לקצר אותו, או לשלוח אותו לעצמך בוואטסאפ, שמקטין אותו, ולהעלות משם.</div>`:''}
    ${catPicker(prev!==null?prev:lastUploadGroup)}
    <div class="modal-actions"><button type="button" class="btn-save" onclick="startUpload()" ${ok?'':'disabled'}>העלאה${ok>1?` של ${ok}`:''}</button></div>`);
}
function unpickFile(k){
  URL.revokeObjectURL(gmPending[k].url);
  gmPending.splice(k,1);
  if(gmPending.length) renderUploadSheet(); else closeSheet();
}
function startUpload(){
  const group=catValue()||'';
  lastUploadGroup=group;
  const files=gmPending.filter(p=>!p.big).map(p=>p.file);
  closeSheet();
  handleMediaFiles(files,group);
}
function openYoutubeSheet(){
  openSheet('▶ סרטון מיוטיוב', `
    <div class="mfld">
      <label for="ytLink">הקישור לסרטון</label>
      <input id="ytLink" type="url" inputmode="url" dir="ltr" placeholder="https://youtu.be/..." oninput="ytPreview()" onkeydown="if(event.key==='Enter')addYoutube()">
    </div>
    <div class="yt-prev" id="ytPrev" hidden></div>
    <p class="sheet-tip">ביוטיוב: שיתוף ← העתקת קישור. כדאי להעלות את הסרטון כ"לא רשום" (Unlisted), ככה רק מי שבאתר רואה אותו.</p>
    ${catPicker(lastUploadGroup)}
    <div class="modal-actions"><button type="button" class="btn-save" onclick="addYoutube()">הוספה</button></div>`);
}
function ytPreview(){
  const url=YT.fromLink(document.getElementById('ytLink').value);
  const el=document.getElementById('ytPrev');
  el.hidden=!url;
  el.innerHTML=url?`<img src="${esc(YT.thumb(url))}" alt="התמונה של הסרטון"><span class="media-yt" aria-hidden="true">▶</span>`:'';
}
function renderUploadPanel(){
  const el=document.getElementById('gmUpload');
  if(!el) return;
  if(gmUp) el.innerHTML=`
    <div class="gm-up" role="status">
      <div class="gm-up-row"><span>${esc(gmUp.label)}</span><span>${gmUp.n} מתוך ${gmUp.total}</span></div>
      <div class="gm-bar"><i style="width:${Math.round(((gmUp.n-1)+gmUp.pct/100)/gmUp.total*100)}%"></i></div>
    </div>`;
  else if(gmErrors.length) el.innerHTML=`
    <div class="gm-err" role="alert">${gmErrors.map(e=>`<p>⚠️ ${esc(e)}</p>`).join('')}
      <button type="button" onclick="gmErrors=[];renderUploadPanel()">הבנתי</button></div>`;
  else el.innerHTML='';
}
function setUploadProgress(n,total,label,pct){
  gmUp={n,total,label,pct:pct||0};
  renderUploadPanel();
}

/* ===== dragging in the manager =====
   Touch: hold still for a moment to lift (a quick swipe still scrolls), then drag; let go without moving to select.
   Mouse: drag right away. A photo can move inside its category or into another one; a category moves with
   every category folded to its title. The new order is saved when it's dropped. */
const LIFT_MS=320, MOVE_TOL=8;
let gmPress=null, gmDrag=null, gmSuppressClick=0, gmTouchAt=0;
function gmPressStart(x,y,target,touch){
  if(gmPress || gmDrag || gmSel || !target.closest) return;
  if(target.closest('.gm-more,.gm-selall')) return;
  const tile=target.closest('#gmList .gm-tile');
  const sec=!tile && target.closest('#gmList .gm-head') && target.closest('.gm-sec');
  if(!tile && !sec) return;
  gmPress={el:tile||sec, kind:tile?'tile':'group', x0:x, y0:y, x, y, touch, lifted:false};
  if(touch) gmPress.timer=setTimeout(gmLift,LIFT_MS);
}
function gmLift(){
  if(!gmPress) return;
  gmPress.lifted=true;
  gmPress.el.classList.add('lifting');
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
}
function gmPressMove(x,y,e){
  const p=gmPress;
  if(!p) return;
  p.x=x; p.y=y;
  const far=Math.hypot(x-p.x0,y-p.y0)>MOVE_TOL;
  if(gmDrag){ if(e.cancelable) e.preventDefault(); gmDragMove(); return; }
  if(p.touch && !p.lifted){ if(far) gmCancelPress(); return; } // a swipe: let the page scroll
  if(p.lifted && e.cancelable) e.preventDefault();
  if(far) gmStartDrag();
}
function gmCancelPress(){
  if(!gmPress) return;
  clearTimeout(gmPress.timer);
  gmPress.el.classList.remove('lifting');
  gmPress=null;
}
function gmPressEnd(){
  const p=gmPress;
  if(!p) return;
  clearTimeout(p.timer);
  gmPress=null;
  p.el.classList.remove('lifting');
  if(gmDrag){ gmSuppressClick=Date.now()+300; gmDrop(); return; }
  if(p.lifted){
    gmSuppressClick=Date.now()+300;
    if(p.kind==='tile') enterSelect([p.el.dataset.url]);
    else openGroupSheet(p.el.dataset.group);
  }
}
function gmStartDrag(){
  const p=gmPress, el=p.el;
  const body=document.getElementById('gmBody'), list=document.getElementById('gmList');
  const handle=p.kind==='tile'?el:el.querySelector('.gm-head');
  const r=handle.getBoundingClientRect();
  const ghost=handle.cloneNode(true);
  ghost.classList.remove('lifting');
  ghost.classList.add('gm-ghost');
  Object.assign(ghost.style,{width:r.width+'px',height:r.height+'px',left:r.left+'px',top:r.top+'px'});
  document.body.appendChild(ghost);
  el.classList.remove('lifting');
  el.classList.add('gm-ph');
  gmDrag={kind:p.kind, el, ghost, body, dx:p.x0-r.left, dy:p.y0-r.top, lockUntil:0, raf:0};
  if(p.kind==='group'){
    // fold every category to its title, and keep the lifted one under the finger
    list.classList.add('sorting-groups');
    body.scrollTop+=handle.getBoundingClientRect().top-r.top;
  } else list.classList.add('dragging-tile');
  gmDragMove();
  gmDrag.raf=requestAnimationFrame(gmAutoScroll);
}
function gmDragMove(){
  const d=gmDrag, p=gmPress;
  if(!d || !p) return;
  d.ghost.style.top=(p.y-d.dy)+'px';
  if(d.kind==='tile') d.ghost.style.left=(p.x-d.dx)+'px';
  if(performance.now()<d.lockUntil) return; // the last move is still animating
  const hit=document.elementFromPoint(p.x,p.y);
  if(!hit || !hit.closest('#gmList')) return;
  if(d.kind==='tile'){
    const t=hit.closest('.gm-tile');
    if(t && t!==d.el){
      const same=t.parentNode===d.el.parentNode;
      gmFlip('.gm-tile',()=>{ if(same && gmIndex(t)>gmIndex(d.el)) t.after(d.el); else t.before(d.el); });
      return;
    }
    const sec=!t && hit.closest('.gm-sec');
    if(sec && sec!==d.el.closest('.gm-sec')){
      const grid=sec.querySelector('.gm-grid');
      if(sec.classList.contains('closed')){
        sec.classList.remove('closed'); gmCollapsed.delete(sec.dataset.group);
        sec.querySelector('.gm-fold').setAttribute('aria-expanded','true');
      }
      gmFlip('.gm-tile',()=>{ if(hit.closest('.gm-head')) grid.prepend(d.el); else grid.append(d.el); });
    }
  } else {
    const sec=hit.closest('.gm-sec');
    if(sec && sec!==d.el){
      const r=sec.getBoundingClientRect();
      gmFlip('.gm-sec',()=>{ if(p.y<r.top+r.height/2) sec.before(d.el); else sec.after(d.el); });
    }
  }
}
const gmIndex=el=>[...el.parentNode.children].indexOf(el);
// moves the dragged element and slides the others into their new places
function gmFlip(sel,mutate){
  const els=[...document.querySelectorAll('#gmList '+sel)];
  const before=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
  mutate();
  gmDrag.lockUntil=performance.now()+170;
  if(document.documentElement.classList.contains('a11y-still')) return;
  els.forEach(e=>{
    const a=before.get(e), b=e.getBoundingClientRect();
    const dx=a.left-b.left, dy=a.top-b.top;
    if((!dx && !dy) || !b.width) return;
    e.style.transition='none';
    e.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>{ e.style.transition='transform .16s ease'; e.style.transform=''; });
  });
}
// near the top or bottom edge the list scrolls by itself
function gmAutoScroll(){
  const d=gmDrag, p=gmPress;
  if(!d || !p) return;
  const r=d.body.getBoundingClientRect(), edge=70;
  const v = p.y<r.top+edge ? -Math.ceil((r.top+edge-p.y)/5) : p.y>r.bottom-edge ? Math.ceil((p.y-(r.bottom-edge))/5) : 0;
  if(v){ const was=d.body.scrollTop; d.body.scrollTop+=v; if(d.body.scrollTop!==was) gmDragMove(); }
  d.raf=requestAnimationFrame(gmAutoScroll);
}
function gmDrop(){
  const d=gmDrag;
  cancelAnimationFrame(d.raf);
  d.ghost.remove();
  d.el.classList.remove('gm-ph');
  const list=document.getElementById('gmList');
  list.classList.remove('sorting-groups','dragging-tile');
  gmDrag=null;
  if(d.kind==='group') d.el.scrollIntoView({block:'nearest'});
  // the new order as it is on the screen; a photo dropped in another category joins it
  const byUrl=new Map((galleryItems||[]).map(g=>[g.url,g]));
  let items=[];
  list.querySelectorAll('.gm-sec').forEach(sec=>{
    const name=sec.dataset.group;
    sec.querySelectorAll('.gm-tile').forEach(t=>{
      const g=byUrl.get(t.dataset.url);
      if(!g) return;
      byUrl.delete(t.dataset.url);
      items.push((itemGroup(g)||DEFAULT_GROUP)===name ? g : {...g, group:name===DEFAULT_GROUP?'':name});
    });
  });
  byUrl.forEach(g=>{ items=withNewItem(items,g); }); // added while dragging
  if(JSON.stringify(items)===JSON.stringify(galleryItems)){ renderGalleryManager(); return; }
  const changedGroup=items.find(g=>{ const o=galleryItems.find(x=>x.url===g.url); return o && itemGroup(o)!==itemGroup(g); });
  saveGalleryItems(items)
    .then(()=>showToast(changedGroup?`הועבר ל${itemGroup(changedGroup)?`"${itemGroup(changedGroup)}"`:NO_GROUP_LABEL} ✓`:'הסדר נשמר ✓'))
    .catch(e=>{ console.error(e); showToast('שמירת הסדר נכשלה'); loadGalleryItems(); });
}
document.addEventListener('touchstart',e=>{
  gmTouchAt=Date.now();
  if(e.touches.length!==1){ if(!gmDrag) gmCancelPress(); return; }
  gmPressStart(e.touches[0].clientX,e.touches[0].clientY,e.target,true);
},{passive:true});
document.addEventListener('touchmove',e=>{ if(gmPress) gmPressMove(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
document.addEventListener('touchend',gmPressEnd);
document.addEventListener('touchcancel',gmPressEnd);
document.addEventListener('mousedown',e=>{ if(e.button===0 && Date.now()-gmTouchAt>800) gmPressStart(e.clientX,e.clientY,e.target,false); });
document.addEventListener('mousemove',e=>{ if(gmPress && !gmPress.touch) gmPressMove(e.clientX,e.clientY,e); });
document.addEventListener('mouseup',()=>{ if(gmPress && !gmPress.touch) gmPressEnd(); });
// the click that follows a long press or a drop isn't a tap
document.addEventListener('click',e=>{
  if(Date.now()<gmSuppressClick && e.target.closest && e.target.closest('#gmList')){ e.preventDefault(); e.stopPropagation(); }
},true);
document.addEventListener('contextmenu',e=>{ if(e.target.closest && e.target.closest('#gmList')) e.preventDefault(); });

async function shrinkImage(file){
  let bmp;
  try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ return file; }
  const scale=Math.min(1, 1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');
  c.width=Math.round(bmp.width*scale);
  c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close) bmp.close();
  const out=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  return out||file;
}
const MEDIA_EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm'};
// matches storage.rules
const MAX_VIDEO_BYTES=500*1024*1024;
// a YouTube video: only its link is saved; it plays from YouTube on the site
async function addYoutube(){
  const inp=document.getElementById('ytLink');
  const url=YT.fromLink(inp.value);
  if(!url){ showToast('זה לא נראה כמו קישור לסרטון ביוטיוב'); inp.focus(); return; }
  if(!Array.isArray(galleryItems)){ showToast('הגלריה לא נטענה, נסו לפתוח שוב'); return; }
  if(galleryItems.some(g=>g.url===url)){ showToast('הסרטון הזה כבר באתר'); return; }
  const group=catValue()||'';
  lastUploadGroup=group;
  closeSheet();
  try{
    await saveGalleryItems(withNewItem(galleryItems,{kind:'youtube', url, cap:'', group}));
    showToast('הסרטון נוסף לאתר ✓');
  }catch(e){ console.error(e); showToast('ההוספה נכשלה'); loadGalleryItems(); }
}
async function handleMediaFiles(files,group){
  if(!files.length) return;
  if(!storageReady){ showToast('האחסון עוד לא מחובר'); return; }
  if(!Array.isArray(galleryItems)){ showToast('הגלריה לא נטענה, נסו לפתוח שוב'); return; }
  let added=0;
  const errors=[];
  gmErrors=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    // some phones hand over files with an empty type, so fall back to the extension
    const fType=f.type||guessMediaType(f.name);
    const isVideo=fType.startsWith('video/');
    if(isVideo && f.size>MAX_VIDEO_BYTES){ errors.push(`${f.name}: הסרטון גדול מדי (${Math.round(f.size/1048576)}MB, אפשר עד 500MB)`); continue; }
    try{
      setUploadProgress(i+1,files.length,'מכין קובץ...');
      const body=fType.startsWith('image/') ? await shrinkImage(f) : f;
      const type=body.type||fType;
      const ext=MEDIA_EXT[type];
      if(!ext){ errors.push(`${f.name}: סוג קובץ לא נתמך (${type||'לא ידוע'})`); continue; }
      const st=await fbStorage();
      const path=`gallery/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      // a file's name never changes, so browsers may keep it for a year
      const task=st.uploadBytesResumable(st.ref(st.storage,path), body, {contentType:type, cacheControl:'public, max-age=31536000, immutable'});
      await new Promise((resolve,reject)=>task.on('state_changed',
        snap=>setUploadProgress(i+1,files.length,`מעלה ${isVideo?'סרטון':'תמונה'}...`,snap.totalBytes?snap.bytesTransferred/snap.totalBytes*100:0),
        reject, resolve));
      const url=await st.getDownloadURL(task.snapshot.ref);
      await saveGalleryItems(withNewItem(galleryItems,{kind:isVideo?'video':'image', url, cap:'', group, path}));
      added++;
    }catch(e){
      console.error(e);
      errors.push(`${f.name}: ההעלאה נכשלה - ${e&&e.code?storageProblem(e):(e&&e.message||String(e))}`);
    }
  }
  gmUp=null;
  gmErrors=errors;
  renderUploadPanel();
  if(added) showToast(added===1?'נוסף לאתר ✓':`${added} קבצים נוספו לאתר ✓`);
}
function guessMediaType(name){
  const ext=(String(name).split('.').pop()||'').toLowerCase();
  return {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif',
    mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm'}[ext]||'';
}

/* ===== install as app (PWA) ===== */
let _deferredInstallPrompt=null;
const _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const _isStandalone=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw-admin.js').catch(()=>{}); });
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  _deferredInstallPrompt=e;
  showInstallBtn();
});
window.addEventListener('appinstalled', ()=>{
  _deferredInstallPrompt=null;
  const btn=document.getElementById('installBtn');
  if(btn)btn.hidden=true;
});
function showInstallBtn(){
  if(_isStandalone)return;
  const btn=document.getElementById('installBtn');
  if(btn)btn.hidden=false;
}
async function handleInstallClick(){
  if(_deferredInstallPrompt){
    _deferredInstallPrompt.prompt();
    await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt=null;
    document.getElementById('installBtn').hidden=true;
    return;
  }
  if(_isIOS){
    alert('להתקנה ב-iPhone/iPad:\n1. לחצו על כפתור השיתוף ⬆️ בתחתית הדפדפן\n2. גללו ובחרו "הוסף למסך הבית" (Add to Home Screen)');
    return;
  }
  alert('בדפדפן הזה ההתקנה מופיעה בתפריט הדפדפן (⋮) תחת "התקן אפליקציה" או "הוסף למסך הבית".');
}
if(_isIOS && !_isStandalone) showInstallBtn();

initLock();
