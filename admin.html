<!--
  לוח ניהול פרטי לעסק המנגלים - לא מקושר מהאתר הציבורי חוץ מקישור קטן בפוטר.
  הכניסה היא עם חשבון Google. מי מורשה נקבע בחוקי האבטחה (firestore.rules): הבעלים שכתובים
  בחוקים, ומיילים שהם מוסיפים בהגדרות (mangalSettings/admins). ראו README.md.
-->
<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ניהול · BBQ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#20140E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ניהול BBQ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="images/app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF3EC;--surface:#fff;--surface2:#F3E7DA;--border:#EDE0D4;
  --text:#241712;--text2:#7A6A5E;--text3:#B0A296;
  --flame:#D8481B;--flame-dark:#9C2E0E;--flame-bg:#FCE9DF;
  --gold:#B9832A;--gold-bg:#FBF1DE;--char:#20140E;
  --ok:#1D9E75;--ok-bg:#E1F5EE;--bad:#A32D2D;--bad-bg:#FCEBEB;--warn:#B9832A;--warn-bg:#FBF1DE;
  --r:16px;--r2:11px;
  --font:'Rubik',-apple-system,'Segoe UI',Arial,sans-serif;
  --font-head:'Varela Round','Rubik',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button{font-family:var(--font)}

/* lock screen */
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:30px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(32,20,14,.1)}
.lock-ico{font-size:38px}
.lock-card h2{font-family:var(--font-head);margin-top:8px;font-size:18px}
.lock-card p{color:var(--text2);font-size:12.5px;margin-top:6px;margin-bottom:16px}
.lock-card input{width:100%;border:1.5px solid var(--border);border-radius:var(--r2);padding:12px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);text-align:center;direction:ltr;margin-bottom:8px}
.lock-card button.main{width:100%;padding:13px;border-radius:var(--r2);border:none;background:var(--flame);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:4px}
.install-btn{width:100%;padding:11px;border-radius:var(--r2);border:1.5px dashed var(--border);background:transparent;color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer;margin-top:14px;font-family:var(--font)}
.install-btn:hover{border-color:var(--flame);color:var(--flame-dark)}
.lock-err{color:var(--bad);font-size:12.5px;margin-top:8px;display:none}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff!important;color:#1f1f1f!important;border:1.5px solid #dadce0!important;margin-top:6px}
.google-btn:disabled{opacity:.6}
.link-btn{display:block;margin:10px auto 0;background:none;border:none;color:var(--text2);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;font-family:var(--font)}
.admin-me{font-size:12px;color:var(--text2);margin-bottom:8px}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:13px}
.admin-row span{min-width:0;overflow-wrap:anywhere}
.admin-del{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:none;background:var(--bad-bg);color:var(--bad);cursor:pointer}
.admin-empty{font-size:12.5px;color:var(--text3);margin-bottom:6px}
.admin-add{display:flex;gap:8px;margin-top:4px}
.admin-add input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text)}
.admin-hint{display:block;font-size:11.5px;color:var(--text3);margin-top:6px;line-height:1.5}
.sec-status{font-size:13px;font-weight:700;padding:11px 13px;border-radius:var(--r2);margin-bottom:8px}
.sec-status.ok{background:var(--ok-bg);color:var(--ok)}
.sec-status.bad{background:var(--bad-bg);color:var(--bad)}
.sec-status.wait{background:var(--surface2);color:var(--text2)}

/* header */
.hdr{background:linear-gradient(135deg,var(--char),#3A2113);color:#fff;padding:20px 16px 22px;border-radius:0 0 20px 20px}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr-title{font-family:var(--font-head);font-size:18px;display:flex;align-items:center;gap:8px}
.hdr-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.hdr-actions{display:flex;gap:8px;flex-shrink:0}
.share-opts{display:flex;flex-direction:column;gap:8px}
.share-opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:var(--r2);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;font-family:var(--font);text-align:right}
.share-opt .ico{font-size:20px;width:26px;text-align:center}
.share-url{width:100%;margin-top:12px;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text2);direction:ltr;text-align:left}

/* tabs */
.tabs{display:flex;gap:8px;margin:16px 0;overflow-x:auto;padding-bottom:2px}
.tab{position:relative;flex:1;min-width:100px;text-align:center;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);padding:11px 8px;border-radius:14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--char);color:#fff;border-color:var(--char)}
.tab .badge{position:absolute;top:-7px;left:-6px;background:var(--flame);color:#fff;font-size:10.5px;font-weight:800;border-radius:12px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 8px rgba(216,72,27,.4)}

.panel{display:none}
.panel.on{display:block}
.empty{text-align:center;color:var(--text3);font-size:13.5px;padding:40px 10px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 15px;margin-bottom:10px;cursor:pointer;position:relative}
.card.new::before{content:'חדש';position:absolute;top:-8px;right:12px;background:var(--flame);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-name{font-weight:700;font-size:14.5px}
.card-date{font-size:12px;color:var(--text2);font-weight:600}
.card-mid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.chip.lvl{background:var(--flame-bg);color:var(--flame-dark)}
.chip.paid-ok{background:var(--ok-bg);color:var(--ok)}
.chip.paid-part{background:var(--warn-bg);color:var(--warn)}
.chip.paid-no{background:var(--bad-bg);color:var(--bad)}
.card-notes{margin-top:8px;font-size:12.5px;color:var(--text3);line-height:1.5}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions button{flex:1;padding:9px;border-radius:9px;border:none;font-weight:700;font-size:12.5px;cursor:pointer}
.btn-approve{background:var(--ok);color:#fff}
.btn-decline{background:var(--bad-bg);color:var(--bad)}

.section-note{font-size:12px;color:var(--text3);margin:6px 2px 12px;text-align:center}
.toggle-row{display:flex;gap:8px;margin-bottom:12px}
.toggle-row button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer}
.toggle-row button.on{background:var(--flame-bg);border-color:var(--flame);color:var(--flame-dark)}

.debt-total{background:var(--bad-bg);color:var(--bad);border-radius:var(--r2);padding:14px 16px;text-align:center;margin-bottom:14px}
.debt-total b{display:block;font-size:22px;font-family:var(--font-head)}
.debt-total span{font-size:12px;font-weight:600}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(32,20,14,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;padding:20px 18px 26px}
@media(min-width:640px){.modal{border-radius:20px}}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-top h3{font-family:var(--font-head);font-size:17px}
.modal-close{background:var(--surface2);border:none;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--text2)}
.mfld{margin-top:12px}
.mfld label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:5px}
.mfld input,.mfld textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.drow-sub{font-weight:500;color:var(--text2);font-size:12px}
.minfo{font-size:13px;color:var(--text2);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px}
.minfo a{color:var(--flame-dark);font-weight:700;text-decoration:none}
.quickpay{display:flex;gap:8px;margin-top:8px}
.quickpay button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--text2)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.dlist{margin-top:12px;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;font-size:13px;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.drow span{color:var(--text2);flex-shrink:0}
.drow b{font-weight:700;text-align:left;min-width:0;overflow-wrap:anywhere}
.drow a{color:var(--flame-dark);text-decoration:none}
.modal-actions button{flex:1;padding:12px;border-radius:11px;border:none;font-weight:700;font-size:13px;cursor:pointer}
.btn-save{background:var(--flame);color:#fff}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.status-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.status-pill{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer}
.status-pill.on{border-color:var(--char);background:var(--char);color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.btn-add-event{width:100%;padding:12px;border-radius:12px;border:none;background:var(--flame);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:14px;box-shadow:0 8px 18px rgba(216,72,27,.28)}

/* calendar */
.cal-mode-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-mode-toggle{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.cal-mode-toggle button{border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer}
.cal-mode-toggle button.on{background:var(--char);color:#fff}
.cal-today-btn{background:var(--surface2);border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;flex-shrink:0;white-space:nowrap}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.cal-hdr>div{text-align:center;min-width:0}
.cal-title{font-weight:700;font-family:var(--font-head);font-size:15px}
.cal-subtitle{font-size:10.5px;color:var(--text3);margin-top:1px}
.cal-nav{background:var(--surface2);border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cal-weekdays{margin-bottom:4px;font-size:11px;color:var(--text3);font-weight:700;text-align:center}
.cal-cell{aspect-ratio:1/1;min-width:0;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;background:var(--surface);overflow:hidden}
.cal-he-day{font-size:12px;font-weight:700;white-space:nowrap}
.cal-greg-day{font-size:8.5px;color:var(--text3);margin-top:1px}
.cal-cell.has-events .cal-greg-day{color:var(--flame-dark);opacity:.75}
.cal-cell.cal-blank{border:none;background:transparent}
.cal-cell.has-events{cursor:pointer;border-color:var(--flame);background:var(--flame-bg);font-weight:700}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--char)}
/* settings */
.set-sec{margin-top:16px}
.set-title{font-size:11.5px;font-weight:800;color:var(--text3);letter-spacing:.3px;margin-bottom:8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:8px}
.set-txt{min-width:0}
.set-txt b{display:block;font-size:13.5px}
.set-txt small{display:block;font-size:11.5px;color:var(--text3);margin-top:2px}
.set-btn{flex-shrink:0;border:1.5px solid var(--flame);background:var(--surface);color:var(--flame-dark);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.set-btn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.set-test{width:100%;margin:-2px 0 8px;padding:10px;border-radius:var(--r2);border:1.5px dashed var(--border);background:transparent;color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer}
.set-upload{display:block;text-align:center;padding:13px;border-radius:var(--r2);border:1.5px dashed var(--flame);background:var(--flame-bg);color:var(--flame-dark);font-weight:700;font-size:13.5px;cursor:pointer;margin-top:8px}
.set-restore{display:block;width:100%;margin-top:12px;padding:11px;border-radius:var(--r2);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);font-weight:700;font-size:13.5px;cursor:pointer}
.set-upload.disabled{opacity:.45;pointer-events:none}
.upload-status{font-size:12px;color:var(--text2);text-align:center;margin-top:8px;font-weight:600;white-space:pre-line;overflow-wrap:anywhere}
.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.media-grid .empty{grid-column:1/-1;padding:24px 10px}
.media-tile{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--surface2)}
.media-tile img,.media-tile video{width:100%;height:100%;object-fit:cover;display:block}
.media-tile{cursor:pointer}
.media-badge{position:absolute;top:5px;right:5px;font-size:13px;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 5px}
.media-cap{position:absolute;inset-inline:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);color:#fff;font-size:10.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.media-cap.none{color:rgba(255,255,255,.75);font-weight:500}
.media-hint{font-size:11.5px;color:var(--text3);text-align:center;margin-top:10px}
.cap-edit-bg{z-index:110}
.cap-edit-preview{width:100%;max-height:42vh;object-fit:contain;border-radius:12px;background:var(--surface2);display:block}
.cap-count{font-size:11px;color:var(--text3);text-align:left;margin-top:4px;direction:ltr}
.media-del{position:absolute;top:5px;left:5px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(32,20,14,.75);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.cal-dot{position:absolute;bottom:3px;font-size:9px;background:var(--flame);color:#fff;border-radius:8px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px}
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <div class="lock-ico">🔒</div>
    <h2 id="lockTitle">ניהול BBQ</h2>
    <p id="lockSub">טוען...</p>
    <div id="lockBody"></div>
    <div class="lock-err" id="lockErr">סיסמה שגויה</div>
    <button id="installBtn" class="install-btn" hidden onclick="handleInstallClick()">📲 התקן כאפליקציה</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-in">
      <div class="hdr-title"><img src="images/logo-v2.png" alt="BBQ" style="height:28px;width:28px;border-radius:50%;object-fit:cover">לוח ניהול</div>
      <div class="hdr-actions">
        <button class="hdr-btn" onclick="openShare()">📤 שיתוף</button>
        <button class="hdr-btn" onclick="openSettings()">⚙️ הגדרות</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <div class="tab on" data-tab="board" onclick="setTab('board')">לוח אירועים</div>
      <div class="tab" data-tab="pending" onclick="setTab('pending')">בקשות חדשות<span class="badge" id="badgePending" style="display:none">0</span></div>
      <div class="tab" data-tab="debts" onclick="setTab('debts')">חובות<span class="badge" id="badgeDebts" style="display:none">0</span></div>
    </div>

    <div class="panel" id="panel-pending">
      <div id="pendingList"></div>
      <div id="declinedWrap" style="margin-top:22px"></div>
    </div>

    <div class="panel on" id="panel-board">
      <button class="btn-add-event" onclick="openNewEventModal()">+ הוספת אירוע חדש</button>
      <div class="toggle-row">
        <button class="on" id="viewList" onclick="setBoardView('list')">📋 רשימה</button>
        <button id="viewCalendar" onclick="setBoardView('calendar')">📅 לוח שנה</button>
      </div>
      <div id="boardListWrap">
        <div class="toggle-row">
          <button class="on" id="btnUpcoming" onclick="setBoardFilter('upcoming')">אירועים קרובים</button>
          <button id="btnPast" onclick="setBoardFilter('past')">אירועים שעברו</button>
        </div>
        <div id="boardList"></div>
      </div>
      <div id="boardCalendarWrap" style="display:none"></div>
    </div>

    <div class="panel" id="panel-debts">
      <div id="debtsTotal"></div>
      <div id="debtsList"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="gallery-default.js"></script>
<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyA5Qp3W1dcpd4ncnTyB68nMueXtHbAoLAk",
  authDomain: "mangal-b11fe.firebaseapp.com",
  projectId: "mangal-b11fe",

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);

  }catch(e){}
}

const _heYearFmt=new Intl.DateTimeFormat('he-u-ca-hebrew',{year:'numeric'});
/* Hebrew numeral (gematria) letters for a plain number, e.g. 17 -> י״ז, 5787 -> תשפ״ז
   (thousands dropped per the usual year-writing convention; 15/16 use ט״ו/ט״ז to
   avoid spelling the letter-combinations that resemble God's name) */
function hebrewNumeral(num){
  const map=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  let rem=num%1000;
  if(rem===0) rem=num;
  let letters='';
  while(rem>0){
    if(rem===15){ letters+='טו'; break; }
    if(rem===16){ letters+='טז'; break; }
    const hit=map.find(([val])=>rem>=val);
    if(!hit) break;
    letters+=hit[1]; rem-=hit[0];
  }
  if(!letters) return String(num);
  return letters.length>1 ? letters.slice(0,-1)+'״'+letters.slice(-1) : letters+'׳';
}
function heMonthKey(date){ return _heMonthFmt.format(date)+' '+_heYearFmt.format(date); }
/* scans day-by-day (a hebrew month is at most 30 days) to find the Gregorian
   start/end dates of the hebrew month containing `anchor` - Intl only converts
   gregorian->hebrew, not the other way, so this is the simple robust way to
   find hebrew month boundaries */
function hebrewMonthBounds(anchor){
  const key=heMonthKey(anchor);
  let start=new Date(anchor);
  while(true){
    const prev=new Date(start); prev.setDate(prev.getDate()-1);
    if(heMonthKey(prev)!==key) break;
    start=prev;
  }
  let end=new Date(anchor);
  while(true){
    const next=new Date(end); next.setDate(next.getDate()+1);
    if(heMonthKey(next)!==key) break;
    end=next;
  }
  return {start,end};
}

function calToday(){
  if(calMode==='hebrew') calHebrewAnchor=new Date();
  else { calMonth=new Date(); calMonth.setDate(1); }
  renderCalendar();
}
function calShift(dir){
  if(calMode==='hebrew'){
    const {start,end}=hebrewMonthBounds(calHebrewAnchor);
    const next=new Date(dir>0?end:start);
    next.setDate(next.getDate()+dir);
    calHebrewAnchor=next;
  } else {
    calMonth.setMonth(calMonth.getMonth()+dir);
  }
  renderCalendar();
}
function renderCalendar(){
  const el=document.getElementById('boardCalendarWrap');
  const todayStr=new Date().toISOString().slice(0,10);
  const byDay={};
  bookings.filter(b=>b.status==='approved' && b.date).forEach(b=>{
    (byDay[b.date]=byDay[b.date]||[]).push(b);
  });

  let title, subtitle, startWeekday, daysCount, cellDate;
  if(calMode==='hebrew'){
    const {start,end}=hebrewMonthBounds(calHebrewAnchor);
    daysCount=Math.round((end-start)/86400000)+1;
    startWeekday=start.getDay();
    title=`${_heMonthFmt.format(start)} ${hebrewNumeral(parseInt(_heYearFmt.format(start),10))}`;
    const sameGregMonth = start.getMonth()===end.getMonth() && start.getFullYear()===end.getFullYear();
    subtitle = sameGregMonth
      ? start.toLocaleDateString('he-IL',{month:'long',year:'numeric'})
      : `${start.toLocaleDateString('he-IL',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'})}`;
    cellDate=(i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; };
  } else {
    const y=calMonth.getFullYear(), m=calMonth.getMonth();
    daysCount=new Date(y,m+1,0).getDate();
    startWeekday=new Date(y,m,1).getDay();
    title=calMonth.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
    subtitle='';
    cellDate=(i)=>new Date(y,m,i+1);
  }

  let cells='';
  for(let i=0;i<startWeekday;i++) cells+=`<div class="cal-cell cal-blank"></div>`;
  for(let i=0;i<daysCount;i++){
    const d=cellDate(i);
    const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const evs=byDay[dateStr]||[];
    const mainLabel = calMode==='hebrew' ? hebrewNumeral(i+1) : String(d.getDate());
    const subLabel = calMode==='hebrew' ? String(d.getDate()) : '';
    cells+=`<div class="cal-cell ${evs.length?'has-events':''} ${dateStr===todayStr?'today':''}" ${evs.length?`onclick="openDayEvents('${dateStr}')"`:''}>
      <span class="cal-he-day">${mainLabel}</span>
      ${subLabel?`<span class="cal-greg-day">${subLabel}</span>`:''}
      ${evs.length?`<span class="cal-dot">${evs.length}</span>`:''}
    </div>`;
  }

  el.innerHTML=`
    <div class="cal-mode-row">
      <div class="cal-mode-toggle">
        <button class="${calMode==='hebrew'?'on':''}" onclick="setCalMode('hebrew')">עברי</button>
        <button class="${calMode==='gregorian'?'on':''}" onclick="setCalMode('gregorian')">לועזי</button>
      </div>
      <button class="cal-today-btn" onclick="calToday()">📍 היום</button>
    </div>
    <div class="cal-hdr">
      <button class="cal-nav" onclick="calShift(-1)">‹ הקודם</button>
      <div>
        <div class="cal-title">${title}</div>
        ${subtitle?`<div class="cal-subtitle">${subtitle}</div>`:''}
      </div>
      <button class="cal-nav" onclick="calShift(1)">הבא ›</button>
    </div>
    <div class="cal-grid cal-weekdays">${['א','ב','ג','ד','ה','ו','ש'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}
function openDayEvents(dateStr){
  const evs=bookings.filter(b=>b.status==='approved' && b.date===dateStr);
  if(evs.length===1){ openDetails(evs[0].id); return; }
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-top"><h3>${fmtDate(dateStr)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        ${evs.map(b=>`<div class="card" onclick="openDetails('${b.id}')">
          <div class="card-top"><div class="card-name">${esc(b.name)}</div></div>
          <div class="card-mid"><span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span><span class="chip">👥 ${guestsText(b)}</span>${washChip(b)}${paidChip(b)}</div>
        </div>`).join('')}
      </div>
    </div>`;
}

// "30 · 18 גברים · 12 נשים"; older bookings only have the total
function guestsText(b){
  const g=Number(b.guests||0);
  return (b.men!=null && b.women!=null) ? `${g} · ${esc(b.men)} גברים · ${esc(b.women)} נשים` : `${g} אנשים`;
}
// the venue has to be ready an hour before handwashing
function prepTime(t){
  if(!/^\d{2}:\d{2}$/.test(t||'')) return '';
  const [h,m]=t.split(':').map(Number), mins=(h*60+m-60+1440)%1440;
  return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
}
const washChip=(b)=>b.washTime?`<span class="chip">🕖 נט"י ${esc(b.washTime)}</span>`:'';
function fmtDate(d){
  if(!d)return '';
  try{ return new Date(d+'T00:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric',weekday:'short'}); }
  catch(e){ return d; }
}
function paidChip(b){
  const total=Number(b.totalPrice||0), paid=Number(b.paidAmount||0);
  if(total<=0) return `<span class="chip">מחיר טרם נקבע</span>`;
  if(paid>=total) return `<span class="chip paid-ok">✓ שולם במלואו</span>`;
  if(paid>0) return `<span class="chip paid-part">שולם חלקית (${paid}/${total}₪)</span>`;
  return `<span class="chip paid-no">לא שולם (${total}₪)</span>`;
}

function renderAll(){
  renderPending();
  renderBoard();
  if(boardView==='calendar') renderCalendar();
  renderDebts();
}

/* ===== pending tab ===== */
function renderPending(){
  const pending=bookings.filter(b=>b.status==='pending');
  const badge=document.getElementById('badgePending');
  if(pending.length){badge.style.display='flex';badge.textContent=pending.length;}
  else badge.style.display='none';
  document.title = pending.length ? `(${pending.length}) לוח ניהול · מנגל בלהבות` : 'ניהול · מנגל בלהבות';

  const list=document.getElementById('pendingList');
  if(!pending.length){
    list.innerHTML=`<div class="empty">אין בקשות חדשות כרגע 🌿</div>`;
  } else {
    list.innerHTML=pending.map(b=>`
      <div class="card new">
        <div class="card-top">
          <div class="card-name">${esc(b.name)}</div>
          <div class="card-date">📅 ${fmtDate(b.date)}</div>
        </div>
        <div class="card-mid">
          <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
          <span class="chip">👥 ${guestsText(b)}</span>
          ${washChip(b)}
          ${b.location?`<span class="chip">📍 ${esc(b.location)}</span>`:''}
        </div>
        ${b.notes?`<div class="card-notes">"${esc(b.notes)}"</div>`:''}
        <div class="minfo">📞 <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>${b.email?` · ✉️ ${esc(b.email)}`:''}</div>
        <div class="card-actions">
          <button class="btn-approve" onclick="event.stopPropagation();approveBooking('${b.id}')">✅ אישור</button>
          <button class="btn-decline" onclick="event.stopPropagation();declineBooking('${b.id}')">❌ דחייה</button>
        </div>
      </div>`).join('');
  }

  const declined=bookings.filter(b=>b.status==='declined');
  const dWrap=document.getElementById('declinedWrap');
  if(!declined.length){ dWrap.innerHTML=''; return; }
  dWrap.innerHTML=`<div class="section-note">בקשות שנדחו (${declined.length})</div>` +
    declined.map(b=>`<div class="card" style="opacity:.6" onclick="openDetails('${b.id}')">
      <div class="card-top"><div class="card-name">${esc(b.name)}</div><div class="card-date">📅 ${fmtDate(b.date)}</div></div>
    </div>`).join('');
}
async function approveBooking(id){
  const {db,doc,updateDoc}=await fbInit();
  const b=bookings.find(x=>x.id===id);
  const patch={status:'approved'};
  if(b && !b.totalPrice) patch.totalPrice=Number(b.guests||0)*(LEVEL_PRICE[b.level]||0);
  await updateDoc(doc(db,'mangalBookings',id),patch);
  showToast('האירוע אושר ונכנס ללוח ✓');
}
async function declineBooking(id){
  if(!confirm('לדחות את הבקשה הזו?'))return;
  const {db,doc,updateDoc}=await fbInit();
  await updateDoc(doc(db,'mangalBookings',id),{status:'declined'});
  showToast('הבקשה נדחתה');
}

/* ===== board tab ===== */
function renderBoard(){
  const today=new Date().toISOString().slice(0,10);
  let list=bookings.filter(b=>b.status==='approved');
  list = boardFilter==='upcoming' ? list.filter(b=>b.date>=today) : list.filter(b=>b.date<today);
  if(boardFilter==='past') list=list.slice().reverse();
  const el=document.getElementById('boardList');
  if(!list.length){ el.innerHTML=`<div class="empty">אין אירועים ${boardFilter==='upcoming'?'קרובים':'מהעבר'} בלוח</div>`; return; }
  el.innerHTML=list.map(b=>`
    <div class="card" onclick="openDetails('${b.id}')">
      <div class="card-top">
        <div class="card-name">${esc(b.name)}</div>
        <div class="card-date">📅 ${fmtDate(b.date)}</div>
      </div>
      <div class="card-mid">
        <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
        <span class="chip">👥 ${guestsText(b)}</span>
        ${washChip(b)}
        ${b.location?`<span class="chip">📍 ${esc(b.location)}</span>`:''}
        ${paidChip(b)}
      </div>
    </div>`).join('');
}

/* ===== debts tab ===== */
function renderDebts(){
  const debts=bookings.filter(b=>b.status==='approved' && Number(b.totalPrice||0)>0 && Number(b.paidAmount||0)<Number(b.totalPrice||0));
  debts.sort((a,b)=>a.date<b.date?-1:1);
  const badge=document.getElementById('badgeDebts');
  if(debts.length){badge.style.display='flex';badge.textContent=debts.length;} else badge.style.display='none';

  const totalOwed=debts.reduce((s,b)=>s+(Number(b.totalPrice||0)-Number(b.paidAmount||0)),0);
  const totalEl=document.getElementById('debtsTotal');
  totalEl.innerHTML = debts.length ? `<div class="debt-total"><b>${totalOwed.toLocaleString()}₪</b><span>סה"כ חוב פתוח מ-${debts.length} אירועים</span></div>` : '';

  const el=document.getElementById('debtsList');
  if(!debts.length){ el.innerHTML=`<div class="empty">אין חובות פתוחים 🎉</div>`; return; }
  el.innerHTML=debts.map(b=>{
    const owe=Number(b.totalPrice||0)-Number(b.paidAmount||0);
    return `<div class="card" onclick="openDetails('${b.id}')">
      <div class="card-top">
        <div class="card-name">${esc(b.name)}</div>
        <div class="card-date">📅 ${fmtDate(b.date)}</div>
      </div>
      <div class="card-mid">
        <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
        ${paidChip(b)}
        <span class="chip" style="background:var(--bad-bg);color:var(--bad)">חסר ${owe.toLocaleString()}₪</span>
      </div>
    </div>`;
  }).join('');
}

/* ===== read-only event details ===== */

  const b=bookings.find(x=>x.id===id);
  if(!b)return;
  const total=Number(b.totalPrice||0), paid=Number(b.paidAmount||0);
  const row=(label,value)=>`<div class="drow"><span>${label}</span><b>${value}</b></div>`;
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-top">
          <h3>${esc(b.name)}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="card-mid">
          <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
          <span class="chip">📅 ${fmtDate(b.date)}</span>
          ${paidChip(b)}
        </div>
        <div class="dlist">
          ${row('📞 טלפון', b.phone?`<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>`:'—')}
          ${b.email?row('✉️ אימייל', esc(b.email)):''}
          ${row('📍 מיקום', b.location?esc(b.location):'—')}
          ${row('🕖 נטילת ידיים', b.washTime?`${esc(b.washTime)} <span class="drow-sub">(המקום פנוי מ-${prepTime(b.washTime)})</span>`:'—')}
          ${row('👥 משתתפים', guestsText(b))}
          ${row('💰 מחיר כולל', total>0?`₪${total.toLocaleString()}`:'טרם נקבע')}
          ${row('✓ שולם', `₪${paid.toLocaleString()}`)}
          ${total>0?row('⏳ יתרה לתשלום', `₪${Math.max(total-paid,0).toLocaleString()}`):''}
          ${row('סטטוס', STATUS_LABEL[b.status]||esc(b.status))}
        </div>
        ${b.notes?`<div class="minfo">📝 ${esc(b.notes)}</div>`:''}
        <div class="modal-actions">
          <button class="btn-save" onclick="openModal('${b.id}')">✏️ עריכה</button>
        </div>
      </div>
    </div>`;
}

/* ===== modal ===== */

  if(!b)return;
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-top">
          <h3>${esc(b.name)}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="card-mid">
          <span class="chip lvl">${LEVEL_ICON[b.level]||''} ${esc(b.level)}</span>
          <span class="chip">📅 ${fmtDate(b.date)}</span>
        </div>
        <div class="minfo">📞 <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>${b.email?` · ✉️ ${esc(b.email)}`:''}</div>
        ${b.notes?`<div class="minfo">📝 ${esc(b.notes)}</div>`:''}

          <div class="mfld"><label>נשים</label><input type="number" id="mWomen" min="0" value="${b.women!=null?esc(b.women):''}" oninput="syncGuestTotal('m')"></div>
          <div class="mfld"><label>סה"כ</label><input type="number" id="mGuests" value="${b.guests||0}" min="1"></div>
        </div>
        <div class="mfld"><label>מיקום האירוע</label><input type="text" id="mLocation" value="${b.location?esc(b.location):''}" placeholder="כתובת / אולם / חצר"></div>

        <div class="mrow">
          <div class="mfld"><label>מחיר כולל (₪)</label><input type="number" id="mTotal" value="${b.totalPrice||(Number(b.guests||0)*(LEVEL_PRICE[b.level]||0))}" min="0"></div>
          <div class="mfld"><label>שולם עד כה (₪)</label><input type="number" id="mPaid" value="${b.paidAmount||0}" min="0"></div>
        </div>
        <div class="quickpay">
          <button onclick="calcModalPrice('${b.level}')">📊 חשב לפי תפריט (₪${LEVEL_PRICE[b.level]||0} × משתתפים)</button>
        </div>
        <div class="quickpay">
          <button onclick="document.getElementById('mPaid').value=document.getElementById('mTotal').value">✓ סמן ששולם במלואו</button>
          <button onclick="document.getElementById('mPaid').value=0">↺ אפס תשלום</button>
        </div>

        <div class="mfld"><label>סטטוס אירוע</label>
          <div class="status-row">
            <div class="status-pill ${b.status==='pending'?'on':''}" onclick="setModalStatus(this,'pending')">ממתין לאישור</div>
            <div class="status-pill ${b.status==='approved'?'on':''}" onclick="setModalStatus(this,'approved')">מאושר</div>
            <div class="status-pill ${b.status==='declined'?'on':''}" onclick="setModalStatus(this,'declined')">נדחה/בוטל</div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn-danger" onclick="deleteBooking('${b.id}')">🗑️ מחיקה</button>
          <button class="btn-save" onclick="saveModal('${b.id}')">💾 שמירה</button>
        </div>
      </div>
    </div>`;
  root.dataset.status=b.status;
}
function calcModalPrice(level){
  const guests=parseInt(document.getElementById('mGuests').value,10)||0;
  document.getElementById('mTotal').value=guests*(LEVEL_PRICE[level]||0);
}
function setModalStatus(el,status){
  document.querySelectorAll('.status-pill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('modalRoot').dataset.status=status;
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

/* ===== share the public site (not the admin) ===== */
const SHARE_TEXT='BBQ · חגיגת ברבקיו משחררת 🔥 מנגל לאירועים עם דודי: תמונות, תפריטים והזמנת אירוע';
const publicSiteUrl=()=>location.origin+'/';
function openShare(){
  const url=publicSiteUrl();
  const msg=`${SHARE_TEXT}\n${url}`;
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-top"><h3>📤 שיתוף האתר</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div class="share-opts">
          <a class="share-opt" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" onclick="setTimeout(closeModal,300)"><span class="ico">💬</span>וואטסאפ</a>
          <a class="share-opt" href="mailto:?subject=${encodeURIComponent('BBQ · מנגל לאירועים')}&body=${encodeURIComponent(msg)}" onclick="setTimeout(closeModal,300)"><span class="ico">✉️</span>מייל</a>
          <button class="share-opt" onclick="copySiteLink()"><span class="ico">🔗</span>העתקת קישור</button>
          ${navigator.share?`<button class="share-opt" onclick="nativeShare()"><span class="ico">⋯</span>אפליקציה אחרת</button>`:''}
        </div>
        <input class="share-url" id="shareUrl" readonly value="${esc(url)}" onclick="this.select()">
      </div>
    </div>`;
}
async function copySiteLink(){
  const url=publicSiteUrl();
  try{ await navigator.clipboard.writeText(url); }
  catch(e){
    const inp=document.getElementById('shareUrl');
    if(inp){ inp.select(); try{ document.execCommand('copy'); }catch(err){} }
  }
  showToast('הקישור הועתק ✓');
}
async function nativeShare(){
  try{ await navigator.share({title:'BBQ · חגיגת ברבקיו משחררת', text:SHARE_TEXT, url:publicSiteUrl()}); closeModal(); }
  catch(e){ /* the person closed the share sheet */ }
}
// men + women fill in the total; the total stays editable for bookings that only have a total
function syncGuestTotal(prefix){
  const men=parseInt(document.getElementById(prefix+'Men').value,10), women=parseInt(document.getElementById(prefix+'Women').value,10);
  if(isNaN(men) && isNaN(women)) return;
  document.getElementById(prefix+'Guests').value=(men||0)+(women||0);
  if(prefix==='n') recalcNewEventPrice();
}
function readMenWomen(prefix){
  const men=parseInt(document.getElementById(prefix+'Men').value,10), women=parseInt(document.getElementById(prefix+'Women').value,10);
  return (isNaN(men) && isNaN(women)) ? {men:null,women:null} : {men:men||0,women:women||0};
}
async function saveModal(id){
  const {men,women}=readMenWomen('m');
  const guests=men!=null ? men+women : (parseInt(document.getElementById('mGuests').value,10)||0);
  const washTime=document.getElementById('mWash').value||null;
  const location=document.getElementById('mLocation').value.trim();
  const totalPrice=parseFloat(document.getElementById('mTotal').value)||0;
  const paidAmount=parseFloat(document.getElementById('mPaid').value)||0;
  const status=document.getElementById('modalRoot').dataset.status||'approved';
  const {db,doc,updateDoc}=await fbInit();
  await updateDoc(doc(db,'mangalBookings',id),{guests,men,women,washTime,location:location||null,totalPrice,paidAmount,status});
  closeModal();
  showToast('נשמר ✓');
}
async function deleteBooking(id){
  if(!confirm('למחוק את האירוע הזה לצמיתות?'))return;
  const {db,doc,deleteDoc}=await fbInit();
  await deleteDoc(doc(db,'mangalBookings',id));
  closeModal();
  showToast('נמחק');
}

async function shrinkImage(file){
  let bmp;
  try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ return file; }
  const scale=Math.min(1, 1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');
  c.width=Math.round(bmp.width*scale);
  c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close) bmp.close();
  const out=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  return out||file;
}
const MEDIA_EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm'};
const MAX_VIDEO_BYTES=300*1024*1024;
let _blobClient=null;
async function handleMediaFiles(fileList){
  const files=[...fileList];
  if(!files.length) return;
  if(!storageReady){ showToast('האחסון עוד לא מחובר'); return; }
  if(galleryItems===null){ showToast('הגלריה לא נטענה, נסו לפתוח שוב'); return; }
  let added=0;
  const errors=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const prefix=files.length>1?`(${i+1}/${files.length}) `:'';
    // some phones hand over files with an empty type, so fall back to the extension
    const fType=f.type||guessMediaType(f.name);
    const isVideo=fType.startsWith('video/');
    if(isVideo && f.size>MAX_VIDEO_BYTES){ errors.push(`${f.name}: הסרטון גדול מדי (עד 300MB)`); continue; }
    try{
      setUploadStatus(prefix+'מכין קובץ...');
      const body=fType.startsWith('image/') ? await shrinkImage(f) : f;
      const type=body.type||fType;
      const ext=MEDIA_EXT[type];
      if(!ext){ errors.push(`${f.name}: סוג קובץ לא נתמך (${type||'לא ידוע'})`); continue; }
      _blobClient=_blobClient||await import('./vendor/vercel-blob-upload-2.8.0.js');
      const uploadFn = storageMode==='oidc' ? _blobClient.uploadPresigned : _blobClient.upload;
      const name=`gallery/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      let uploading=true; // the progress callback is throttled and can fire after the upload resolves
      const res=await uploadFn(name, body, {
        access:'public',
        handleUploadUrl:'/api/upload',
        clientPayload:JSON.stringify({idToken:await idToken()}),
        contentType:type,
        multipart:body.size>20*1024*1024,
        onUploadProgress:({percentage})=>{ if(uploading) setUploadStatus(`${prefix}מעלה ${isVideo?'סרטון':'תמונה'}... ${Math.round(percentage)}%`); }
      }).finally(()=>{ uploading=false; });
      await saveGalleryItems([{kind:isVideo?'video':'image', url:res.url, cap:'', blob:true}, ...galleryItems]);
      added++;
    }catch(e){
      console.error(e);
      let msg=e&&e.message||String(e);
      if(/client token|presigned URL/i.test(msg)) msg+=' | '+await uploadServerReason();
      errors.push(`${f.name}: ההעלאה נכשלה - ${msg}`);
    }
  }
  setUploadStatus(errors.length ? '⚠️ '+errors.join('\n⚠️ ') : '');
  if(added) showToast(added===1?'נוסף לאתר ✓':`${added} קבצים נוספו לאתר ✓`);
}
// the blob client only says "Failed to retrieve the client token / presigned URL"; ask the server directly for its reason
async function uploadServerReason(){
  try{
    const r=await fetch('/api/upload',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({type:storageMode==='oidc'?'blob.generate-presigned-url':'blob.generate-client-token',payload:{pathname:'gallery/probe.jpg',multipart:false,clientPayload:JSON.stringify({idToken:await idToken()})}})});
    const j=await r.json().catch(()=>({}));
    return `שרת: ${r.status} ${j.error||''}`.trim();
  }catch(e){ return 'שרת לא זמין'; }
}
function guessMediaType(name){
  const ext=(String(name).split('.').pop()||'').toLowerCase();
  return {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif',
    mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm'}[ext]||'';
}

  }
  if(_isIOS){
    alert('להתקנה ב-iPhone/iPad:\n1. לחצו על כפתור השיתוף ⬆️ בתחתית הדפדפן\n2. גללו ובחרו "הוסף למסך הבית" (Add to Home Screen)');
    return;
  }
  alert('בדפדפן הזה ההתקנה מופיעה בתפריט הדפדפן (⋮) תחת "התקן אפליקציה" או "הוסף למסך הבית".');
}
if(_isIOS && !_isStandalone) showInstallBtn();

initLock();
</script>
