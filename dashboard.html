<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#20140E">
<title>כניסות לאתרים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF3EC;--surface:#fff;--surface2:#F3E7DA;--border:#EDE0D4;
  --text:#241712;--text2:#7A6A5E;--text3:#9C8D80;
  --flame:#D8481B;--char:#20140E;--bad:#A32D2D;--bad-bg:#FCEBEB;
  --r:16px;--r2:11px;
  --font:'Rubik',-apple-system,'Segoe UI',Arial,sans-serif;
  --font-head:'Varela Round','Rubik',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16110E;--surface:#221A15;--surface2:#2C221C;--border:#3A2E26;
    --text:#F5ECE4;--text2:#C2B2A5;--text3:#8E7F73;--char:#F5ECE4;--bad:#F09595;--bad-bg:#3A1E1E;
  }
}
:root[data-theme="dark"]{
  --bg:#16110E;--surface:#221A15;--surface2:#2C221C;--border:#3A2E26;
  --text:#F5ECE4;--text2:#C2B2A5;--text3:#8E7F73;--char:#F5ECE4;--bad:#F09595;--bad-bg:#3A1E1E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;padding-bottom:40px}
button{font-family:var(--font)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:22px 0 14px;display:flex;align-items:center;gap:10px}
header h1{font-family:var(--font-head);font-size:21px;flex:1}
.icon-btn{border:1.5px solid var(--border);background:var(--surface);color:var(--text2);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}

/* site tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 13px;text-align:right;cursor:pointer;color:var(--text);
  display:flex;flex-direction:column;gap:4px;min-height:150px;transition:transform .12s,box-shadow .12s;border-top:4px solid var(--c)}
.tile:hover{box-shadow:0 8px 24px rgba(32,20,14,.10);transform:translateY(-1px)}
.tile:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.tile .t-ico{font-size:24px}
.tile .t-name{font-family:var(--font-head);font-size:16.5px;font-weight:700}
.tile .t-big{font-size:26px;font-weight:800;margin-top:auto;font-variant-numeric:tabular-nums;color:var(--c)}
.tile .t-big small{font-size:12px;font-weight:600;color:var(--text2);margin-right:4px}
.tile .t-sub{font-size:12px;color:var(--text2);line-height:1.45}
.tile .t-state{font-size:12.5px;color:var(--text2);margin-top:auto}

/* detail view */
.detail-top{display:flex;align-items:center;gap:10px;padding:18px 0 14px}
.detail-top h2{font-family:var(--font-head);font-size:20px;flex:1}
.back{border:none;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--text)}
.empty{text-align:center;color:var(--text2);font-size:14px;padding:30px 10px;line-height:1.7}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:26px 20px;text-align:center}
.login-card p{color:var(--text2);font-size:13.5px;line-height:1.6;margin:8px 0 16px}
.g-btn{width:100%;max-width:300px;padding:13px;border-radius:var(--r2);border:none;background:var(--char);color:var(--bg);font-weight:700;font-size:15px;cursor:pointer}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r2);padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.55}
.link-btn{background:none;border:none;color:var(--text2);text-decoration:underline;font-size:12.5px;cursor:pointer;margin-top:14px}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 12px;text-align:center}
.stat-box b{display:block;font-size:22px;font-family:var(--font-head);color:var(--text);margin-top:6px}
.stat-box span{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-top:2px}
.stat-box small{display:block;font-size:11.5px;color:var(--text3)}
.stats-days{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px}
.stats-days h3{font-size:13.5px;margin:0 0 10px;color:var(--text2)}
.stat-row{display:grid;grid-template-columns:74px 1fr 58px;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:var(--text2)}
.stat-bar{height:10px;border-radius:6px;background:var(--flame);min-width:2px}
.stat-row b{text-align:left;color:var(--text)}
.stats-note{font-size:12px;color:var(--text3);text-align:center;margin-top:12px;line-height:1.55}
.vi-wrap{margin-top:20px}
.vi-wrap>h3{font-size:15px;margin:0 0 10px}
.vi-range{display:flex;gap:6px;margin-bottom:12px}
.vi-range button{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:12.5px;font-weight:700;cursor:pointer}
.vi-range button[aria-pressed="true"]{background:var(--char);border-color:var(--char);color:var(--bg)}
.vi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px}
.vi-card h4{font-size:13.5px;margin:0 0 8px;color:var(--text)}
.vi-card h4 small{font-weight:400;color:var(--text3);font-size:11.5px;margin-right:6px}
.vi-row{display:grid;grid-template-columns:minmax(0,118px) 1fr auto;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:var(--text2)}
.vi-row b{color:var(--text);font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}
.vi-row b small{font-weight:400;color:var(--text3);margin-left:6px}
.vi-bar{height:10px;border-radius:6px;background:var(--flame);min-width:2px}
.vi-empty{font-size:12.5px;color:var(--text3)}
.vi-tip{font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.55}

/* people lists (families / emails) */
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:var(--font);background:var(--surface);color:var(--text)}
.tools select{border:1.5px solid var(--border);border-radius:10px;padding:9px 8px;font-size:13px;font-family:var(--font);background:var(--surface);color:var(--text)}
.people{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:2px 14px}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.person:last-child{border-bottom:none}
.person .av{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--text2);flex-shrink:0}
.person .who{flex:1;min-width:0}
.person .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .who small{display:block;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .when{text-align:left;font-size:12px;color:var(--text2);white-space:nowrap}
.person .when b{display:block;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1D9E75;margin-left:5px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
// One page for the visits of all the sites. Each site keeps its own data in its own Firebase project:
// ינקלביץ and שטיינהרט: appData/familyPayments.visits (a name per family member, written when they enter by email)
// מנגל: mangalStats + mangalVisitInfo (same as the admin's "כניסות" tab; needs the admin's Google account)
// תקציב and קלינו: logins/{email} (written on every app open; only the owner's Google account can read it)
const V='12.14.0';
const [appMod,fsMod,authMod]=await Promise.all([
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
]);

const SITES=[
  {id:'yoo',name:'ינקלביץ',ico:'👨‍👩‍👧‍👦',color:'#2F6FD6',kind:'family',
    cfg:{apiKey:"AIzaSyA0MZMuGBBIXckhdiOZRZXRC_NPEte7pMA",authDomain:"yossi20361.firebaseapp.com",projectId:"yossi20361",appId:"1:789621490367:web:e62376e9d46a86903f7c0a"}},
  {id:'steinhart',name:'שטיינהרט',ico:'🏡',color:'#7A4FD0',kind:'family',
    cfg:{apiKey:"AIzaSyDQtXCtPDvi9aJR7OxEdG0eEmuj_EjS8yE",authDomain:"steinhart-ac7d6.firebaseapp.com",projectId:"steinhart-ac7d6",appId:"1:178858976439:web:b86c9d7e6ff0b573e65932"}},
  {id:'mangal',name:'מנגל',ico:'🔥',color:'#D8481B',kind:'mangal',auth:true,
    cfg:{apiKey:"AIzaSyA5Qp3W1dcpd4ncnTyB68nMueXtHbAoLAk",authDomain:"mangal-b11fe.firebaseapp.com",projectId:"mangal-b11fe",appId:"1:523754634162:web:aea58a2857650fadf082ab"}},
  {id:'takchiv',name:'תקציב',ico:'💰',color:'#3E8E63',kind:'email',auth:true,
    cfg:{apiKey:"AIzaSyDU4O_IGPDLc7VkHR5ZvRbLzU6HKSa1C_E",authDomain:"moti1-848e7.firebaseapp.com",projectId:"moti1-848e7",appId:"1:177637818983:web:4830fff93f2dfa6746cac2"}},
  {id:'yo',name:'קלינו',ico:'✨',color:'#C2417D',kind:'email',auth:true,
    cfg:{apiKey:"AIzaSyBSg3joV__1dHQRjyxUtm1dj3iFSQAyeJ4",authDomain:"yossi20362.firebaseapp.com",projectId:"yossi20362",appId:"1:73962288632:web:4ef5d552c37ab47f9c120d"}},
];
const byId=Object.fromEntries(SITES.map(s=>[s.id,s]));

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000;
function relTime(ts){
  if(!ts) return '';
  const mins=Math.round((Date.now()-ts)/60000);
  if(mins<1) return 'ממש עכשיו';
  if(mins<60) return `לפני ${mins} דק'`;
  const hrs=Math.round(mins/60);
  if(hrs<24) return `לפני ${hrs} שע'`;
  const days=Math.round(hrs/24);
  if(days<30) return `לפני ${days} ימים`;
  return new Date(ts).toLocaleDateString('he-IL');
}
function israelDay(offset){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date(Date.now()-offset*DAY));
}
function fmtDate(d){
  if(!d) return '';
  try{ return new Date(d+'T00:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric',weekday:'short'}); }catch(e){ return d; }
}
// start of today / this week (from Sunday) / this month, Israel time, as timestamps
function periodStarts(){
  const t=israelDay(0), d=new Date(t+'T00:00:00');
  const week=new Date(d); week.setDate(d.getDate()-d.getDay());
  return {today:d.getTime(), week:week.getTime(), month:new Date(t.slice(0,8)+'01T00:00:00').getTime()};
}

/* ===== loading each site ===== */
for(const s of SITES){
  s.app=appMod.initializeApp(s.cfg,s.id);
  s.db=fsMod.getFirestore(s.app);
  s.state='loading';
  if(s.auth){
    s.authObj=authMod.getAuth(s.app);
    authMod.onAuthStateChanged(s.authObj,user=>{
      s.user=user;
      if(s.unsub){ s.unsub.forEach(f=>f()); s.unsub=null; }
      if(!user){ s.state='login'; render(); return; }
      s.state='loading'; render(); load(s);
    });
  } else load(s);
}

function fail(s,e){
  console.error(s.id,e);
  s.state=e?.code==='permission-denied'?'denied':'error';
  s.error=e?.message||String(e);
  render();
}

function load(s){
  if(s.kind==='family'){
    s.unsub=[fsMod.onSnapshot(fsMod.doc(s.db,'appData','familyPayments'),snap=>{
      const d=snap.data()||{};
      const fams=new Map((d.families||[]).map(f=>[f.id,f]));
      s.people=(d.visits||[]).map(v=>{
        const f=fams.get(v.famId);
        const fam=f?String(f.name||'').replace('משפחת','').trim():'משפחה שנמחקה';
        return {name:v.name||fam, sub:'משפחת '+fam, count:v.count||1, last:v.lastSeen||0};
      });
      s.state='ok'; render();
    },e=>fail(s,e))];
  }
  if(s.kind==='email'){
    s.unsub=[fsMod.onSnapshot(fsMod.collection(s.db,'logins'),snap=>{
      s.people=snap.docs.map(d=>{ const x=d.data(); return {name:x.name||x.email||d.id, sub:x.email||d.id, email:x.email||d.id, count:Number(x.count||1), last:Number(x.lastSeen||0)}; });
      s.state='ok'; render();
    },e=>fail(s,e))];
  }
  if(s.kind==='mangal'){
    // copied from the mangal admin's "כניסות" tab
    s.unsub=[
      fsMod.onSnapshot(fsMod.collection(s.db,'mangalVisitInfo'),snap=>{
        const vi={};
        snap.docs.filter(d=>/^\d{4}-\d{2}$/.test(d.id)).forEach(d=>{ const x=d.data(), o={}; for(const k in x){ const n=Number(x[k]); if(Number.isFinite(n)&&n>0) o[k]=n; } vi[d.id]=o; });
        mangal.visitInfo=vi; render();
      },e=>{ console.error('visit info',e); mangal.visitInfo='denied'; render(); }),
      fsMod.onSnapshot(fsMod.collection(s.db,'mangalStats'),snap=>{
        const days={};
        snap.docs.forEach(d=>{ const x=d.data(); days[d.id]={views:Number(x.views||0),visitors:Number(x.visitors||0),devices:Number(x.devices||0),
          weekNew:Number(x.weekNew||0),monthNew:Number(x.monthNew||0),periods:'monthNew' in x}; });
        mangal.days=days; s.state='ok'; render();
      },e=>fail(s,e)),
    ];
  }
}

async function signIn(id){
  const s=byId[id];
  s.loginError='';
  try{
    const p=new authMod.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
    await authMod.signInWithPopup(s.authObj,p);
  }catch(e){
    if(e?.code==='auth/popup-closed-by-user'||e?.code==='auth/cancelled-popup-request') return;
    s.loginError=e?.code==='auth/unauthorized-domain'
      ?`הכתובת ${location.hostname} עוד לא מורשית בפרויקט של ${s.name}. ב-Firebase Console של הפרויקט ${s.cfg.projectId}: Authentication ← Settings ← Authorized domains ← Add domain, ולהוסיף את ${location.hostname}.`
      :'הכניסה לא הצליחה: '+(e?.code||e?.message||e);
    render();
  }
}
async function switchAccount(id){ const s=byId[id]; await authMod.signOut(s.authObj); signIn(id); }

/* ===== tiles ===== */
function summary(s){
  if(s.state==='loading') return `<div class="t-state">טוען…</div>`;
  if(s.state==='login') return `<div class="t-state">🔒 לחץ כדי להתחבר</div>`;
  if(s.state==='denied') return `<div class="t-state">⚠️ אין הרשאה לקרוא</div>`;
  if(s.state==='error') return `<div class="t-state">⚠️ שגיאה בטעינה</div>`;
  if(s.kind==='mangal'){
    const d=mangal.days||{}, today=israelDay(0), month=today.slice(0,8);
    const t=d[today]||{views:0,visitors:0};
    const m=Object.keys(d).filter(k=>k.startsWith(month)).reduce((a,k)=>a+d[k].views,0);
    return `<div class="t-big">${t.views.toLocaleString()}<small>כניסות היום</small></div>
      <div class="t-sub">${t.visitors.toLocaleString()} מכשירים היום · ${m.toLocaleString()} החודש</div>`;
  }
  const p=periodStarts(), ppl=s.people||[];
  const week=ppl.filter(x=>x.last>=p.week).length;
  const last=[...ppl].sort((a,b)=>b.last-a.last)[0];
  return `<div class="t-big">${week}<small>נכנסו השבוע</small></div>
    <div class="t-sub">${ppl.length} אנשים · ${ppl.reduce((a,x)=>a+x.count,0).toLocaleString()} כניסות${last?`<br>אחרון: ${esc(last.name)}, ${relTime(last.last)}`:''}</div>`;
}
function renderHome(){
  document.title='כניסות לאתרים';
  return `<header><h1>📊 הכניסות לאתרים שלי</h1></header>
    <div class="tiles">${SITES.map(s=>`<button type="button" class="tile" style="--c:${s.color}" onclick="location.hash='${s.id}'">
      <span class="t-ico">${s.ico}</span><span class="t-name">${s.name}</span>${summary(s)}</button>`).join('')}</div>
    <div class="stats-note">לחיצה על אתר פותחת את כל הנתונים שלו.</div>`;
}

/* ===== one site ===== */
const view={sort:'last', q:''};
function peopleHtml(s){
  const p=periodStarts(), ppl=s.people||[];
  const n=from=>ppl.filter(x=>x.last>=from).length;
  const q=view.q.trim().toLowerCase();
  let list=ppl.filter(x=>!q||(x.name+' '+x.sub).toLowerCase().includes(q));
  list.sort(view.sort==='count'?(a,b)=>b.count-a.count:view.sort==='name'?(a,b)=>a.name.localeCompare(b.name,'he'):(a,b)=>b.last-a.last);
  const box=(l,v,sm)=>`<div class="stat-box"><span>${l}</span><b>${v.toLocaleString()}</b><small>${sm}</small></div>`;
  const what=s.kind==='family'?'השם נרשם לפי המייל שאיתו נכנסו':'לפי המייל שאיתו נרשמו';
  return `<div class="stats-grid">
      ${box('היום',n(p.today),'נכנסו')}${box('השבוע (מיום א\')',n(p.week),'נכנסו')}
      ${box('החודש',n(p.month),'נכנסו')}${box('סה"כ',ppl.length,`אנשים · ${ppl.reduce((a,x)=>a+x.count,0).toLocaleString()} כניסות`)}
    </div>
    ${!ppl.length?`<div class="empty">${s.kind==='email'?'עוד אין כניסות רשומות.<br>הספירה מתחילה מהכניסה הבאה של כל משתמש לאפליקציה.':'אין עדיין כניסות רשומות'}</div>`:`
    <div class="tools"><input type="search" placeholder="חיפוש שם${s.kind==='email'?' או מייל':''}" value="${esc(view.q)}" oninput="setQ(this.value)" aria-label="חיפוש">
      <select onchange="setSort(this.value)" aria-label="מיון">
        <option value="last" ${view.sort==='last'?'selected':''}>אחרונים</option>
        <option value="count" ${view.sort==='count'?'selected':''}>הכי הרבה כניסות</option>
        <option value="name" ${view.sort==='name'?'selected':''}>לפי שם</option>
      </select></div>
    <div class="people" id="peopleList">${listHtml(list,p)}</div>`}
    <div class="stats-note">${what}. ליד כל אחד: כמה פעמים נכנס בסך הכול ומתי בפעם האחרונה. "נכנסו" = כמה אנשים שונים נכנסו בתקופה (לפי הכניסה האחרונה שלהם).</div>`;
}
function listHtml(list,p){
  if(!list.length) return `<div class="empty">לא נמצא</div>`;
  return list.map(x=>`<div class="person"><div class="av">${esc((x.name||'?').trim().charAt(0)||'?')}</div>
    <div class="who"><b>${x.last>=p.today?'<span class="dot" title="נכנס היום"></span>':''}${esc(x.name)}</b><small ${x.email?'dir="ltr" style="text-align:right"':''}>${esc(x.sub)}</small></div>
    <div class="when"><b>${x.count.toLocaleString()}</b>כניסות · ${relTime(x.last)}</div></div>`).join('');
}
window.setQ=v=>{ view.q=v; const el=document.getElementById('peopleList'); const s=byId[location.hash.slice(1)];
  if(el&&s){ const q=v.trim().toLowerCase(); let list=(s.people||[]).filter(x=>!q||(x.name+' '+x.sub).toLowerCase().includes(q));
    list.sort(view.sort==='count'?(a,b)=>b.count-a.count:view.sort==='name'?(a,b)=>a.name.localeCompare(b.name,'he'):(a,b)=>b.last-a.last);
    el.innerHTML=listHtml(list,periodStarts()); } };
window.setSort=v=>{ view.sort=v; render(); };

/* מנגל: the same view as the admin's "כניסות" tab */
const mangal={days:null, visitInfo:null, range:'this'};
function mangalHtml(){
  const statsDays=mangal.days||{};
  const today=israelDay(0);
  const weekStart=(d=>{ const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()-t.getUTCDay()); return t.toISOString().slice(0,10); })(today);
  const monthStart=today.slice(0,8)+'01';
  const days=Object.keys(statsDays).sort();
  const sumFrom=(from,f)=>days.filter(k=>k>=from&&k<=today).reduce((a,k)=>a+statsDays[k][f],0);
  const all=days.reduce((a,k)=>({views:a.views+statsDays[k].views,devices:a.devices+statsDays[k].devices}),{views:0,devices:0});
  const countedFrom=days.find(k=>statsDays[k].periods);
  const partial=from=>!countedFrom||countedFrom>from;
  const day=k=>statsDays[k]||{views:0,visitors:0};
  const box=(label,views,devs,note)=>`<div class="stat-box"><span>${label}</span><b>${views.toLocaleString()}</b><small>כניסות</small>
    <b>${devs.toLocaleString()}</b><small>מכשירים שונים${note?' *':''}</small></div>`;
  const wPart=partial(weekStart), mPart=partial(monthStart);
  const last=[]; for(let i=0;i<14;i++){ const k=israelDay(i); last.push({k,...day(k)}); }
  const max=Math.max(1,...last.map(d=>d.views));
  const firstDay=days[0];
  return `<div class="stat-box" style="margin-bottom:10px"><span>סה"כ מאז שהספירה התחילה</span>
      <b>${all.views.toLocaleString()}</b><small>כניסות</small><b>${all.devices.toLocaleString()}</b><small>מכשירים שונים</small></div>
    <div class="stats-grid">
      ${box('היום',day(today).views,day(today).visitors)}${box('אתמול',day(israelDay(1)).views,day(israelDay(1)).visitors)}
      ${box('השבוע (מיום א\')',sumFrom(weekStart,'views'),sumFrom(weekStart,'weekNew'),wPart)}${box('החודש',sumFrom(monthStart,'views'),sumFrom(monthStart,'monthNew'),mPart)}
    </div>
    ${wPart||mPart?`<div class="stats-note" style="margin:-6px 0 14px">* הספירה של מכשירים שונים בשבוע ובחודש התחילה ${countedFrom?`ב-${fmtDate(countedFrom)}`:'עכשיו'}, ולכן המספר מסומן בכוכבית נמוך מהאמת עד ${wPart&&mPart?'סוף החודש':'סוף השבוע'}.</div>`:''}
    <div class="stats-days"><h3>כניסות ב-14 הימים האחרונים (ובסוגריים: מכשירים שונים באותו יום)</h3>
      ${last.map(d=>`<div class="stat-row"><span>${new Date(d.k+'T00:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})}</span><div><div class="stat-bar" style="width:${Math.round(d.views/max*100)}%"></div></div><b>${d.views} (${d.visitors})</b></div>`).join('')}
    </div>
    <div class="stats-note">כניסה = כל פתיחה של האתר. מכשירים שונים = כמה טלפונים ומחשבים נכנסו בתקופה, כל אחד נספר פעם אחת גם אם נכנס כל יום (לפי הדפדפן, כך שמי שגולש משני דפדפנים או מנקה את הדפדפן נספר שוב).${firstDay?`<br>הספירה התחילה ב-${fmtDate(firstDay)}.`:'<br>עוד לא נספרו כניסות.'}</div>
    ${visitInfoHtml()}`;
}
const VI_GROUPS=[
  {p:'src_', t:'מאיפה הגיעו', s:'כניסות', rows:{direct:'ישירה / וואטסאפ',search:'גוגל וחיפוש',ig:'אינסטגרם',fb:'פייסבוק',wa:'וואטסאפ (קישור מסומן)',tiktok:'טיקטוק',other:'אתרים אחרים'},
    tip:'וואטסאפ בדרך כלל לא מגלה שהקישור נפתח ממנו, ולכן רוב הכניסות מוואטסאפ נספרות כ"ישירה". קישור עם ‎?src=wa‎ בסוף נספר כוואטסאפ.'},
  {p:'area_', t:'אזור', s:'כניסות', rows:{jm:'ירושלים',ta:'תל אביב',m:'מרכז',ha:'חיפה',z:'צפון',d:'דרום',ys:'יהודה ושומרון',abroad:'חו"ל',unknown:'לא ידוע'},
    tip:'האזור משוער לפי כתובת האינטרנט ולא תמיד מדויק (למשל בגלישה מהסלולר).'},
  {p:'dev_', t:'מכשיר', s:'כניסות', rows:{mobile:'טלפון',desktop:'מחשב',tablet:'טאבלט'}},
  {p:'act_', t:'מה עשו באתר', s:'בכמה כניסות', rows:{menus:'פתחו את התפריטים',gallery:'פתחו את הגלריה',reviews:'פתחו את ההמלצות',massage:"פתחו את הספא / מסאז'",book:'פתחו את בדיקת הזמינות',bookStart:'התחילו למלא את הטופס',bookSent:'שלחו בקשה',wa:'לחצו על וואטסאפ',call:'לחצו על התקשרות',contact:'שמרו באנשי הקשר'}, keep:true},
];
window.setViRange=r=>{ mangal.range=r; render(); };
function visitInfoHtml(){
  const visitInfo=mangal.visitInfo, viRange=mangal.range;
  const head=`<div class="vi-wrap"><h3>מאיפה הגיעו ומה עשו</h3>`;
  if(visitInfo==='denied') return head+`<div class="empty">אין הרשאה לקרוא את הנתונים. צריך לעדכן את חוקי Firestore (הקובץ firestore.rules).</div></div>`;
  if(!visitInfo) return head+`<div class="empty">טוען…</div></div>`;
  const thisMonth=israelDay(0).slice(0,7);
  const prev=new Date(thisMonth+'-01T00:00:00Z'); prev.setUTCMonth(prev.getUTCMonth()-1);
  const lastMonth=prev.toISOString().slice(0,7);
  const months=viRange==='this'?[thisMonth]:viRange==='last'?[lastMonth]:Object.keys(visitInfo);
  const tot={}; months.forEach(m=>{ const x=visitInfo[m]; if(x) for(const k in x) tot[k]=(tot[k]||0)+x[k]; });
  const first=Object.keys(visitInfo).sort()[0];
  const monthName=m=>new Date(m+'-01T00:00:00').toLocaleDateString('he-IL',{month:'long'});
  const ranges=[['this',`החודש (${monthName(thisMonth)})`],['last',monthName(lastMonth)],['all','כל החודשים']];
  return head+`<div class="vi-range">${ranges.map(([n,l])=>`<button type="button" aria-pressed="${viRange===n}" onclick="setViRange('${n}')">${l}</button>`).join('')}</div>
    ${VI_GROUPS.map(g=>{
      let rows=Object.entries(g.rows).map(([k,l])=>({l,n:tot[g.p+k]||0}));
      if(!g.keep) rows=rows.filter(r=>r.n).sort((a,b)=>b.n-a.n);
      const sum=Object.keys(g.rows).reduce((a,k)=>a+(tot[g.p+k]||0),0);
      const max=Math.max(1,...rows.map(r=>r.n));
      const base=g.p==='act_'?Object.keys(VI_GROUPS[0].rows).reduce((a,k)=>a+(tot['src_'+k]||0),0):sum;
      return `<div class="vi-card"><h4>${g.t}<small>${g.s}</small></h4>${!sum?'<div class="vi-empty">עוד אין נתונים לתקופה הזו</div>':rows.map(r=>`<div class="vi-row"><span>${r.l}</span><div><div class="vi-bar" style="width:${Math.round(r.n/max*100)}%"></div></div><b dir="ltr">${r.n.toLocaleString()}${base?`<small>${Math.round(r.n/base*100)}%</small>`:''}</b></div>`).join('')}${g.tip&&sum?`<div class="vi-tip">${g.tip}</div>`:''}</div>`;
    }).join('')}
    <div class="stats-note">כל כניסה נספרת, גם כניסה שנייה ושלישית של אותו אדם. ב"מה עשו באתר": בכמה כניסות עשו את זה (פעם אחת לכל כניסה). האחוזים הם מתוך הכניסות בתקופה.${first?`<br>הנתונים האלה נאספים מ${monthName(first)}.`:'<br>הנתונים יתחילו להצטבר מהכניסה הבאה לאתר.'}</div></div>`;
}

function siteBody(s){
  if(s.state==='loading') return `<div class="empty">טוען…</div>`;
  if(s.state==='login') return `<div class="login-card"><div style="font-size:34px">${s.ico}</div>
    <p>כדי לראות את הכניסות של ${s.name} צריך להתחבר עם חשבון Google של המנהל (פעם אחת, ואחר כך זה נשמר במכשיר).</p>
    <button class="g-btn" onclick="signIn('${s.id}')">כניסה עם Google</button>
    ${s.loginError?`<div class="err">${esc(s.loginError)}</div>`:''}</div>`;
  if(s.state==='denied') return `<div class="login-card"><p>${s.user?`החשבון ${esc(s.user.email)} לא מורשה לקרוא את הכניסות של ${s.name}.`:'אין הרשאה לקרוא את הנתונים.'}<br>
    ${s.kind==='email'?'צריך לעדכן את חוקי Firestore של האתר (ראה README), עם המייל שלך כבעלים.':s.kind==='mangal'?'צריך להתחבר עם חשבון של מנהל המנגל.':'צריך לבדוק את חוקי Firestore של האתר.'}</p>
    ${s.auth?`<button class="g-btn" onclick="switchAccount('${s.id}')">התחברות עם חשבון אחר</button>`:''}</div>`;
  if(s.state==='error') return `<div class="login-card"><p>לא הצלחתי לטעון את הנתונים.</p><div class="err" dir="ltr">${esc(s.error)}</div></div>`;
  return (s.kind==='mangal'?mangalHtml():peopleHtml(s))
    +(s.user?`<div style="text-align:center"><button class="link-btn" onclick="switchAccount('${s.id}')">מחובר כ-${esc(s.user.email)} · החלפת חשבון</button></div>`:'');
}
function renderSite(s){
  document.title=`${s.name} · כניסות`;
  return `<div class="detail-top"><button class="back" onclick="history.length>1?history.back():location.hash=''" aria-label="חזרה">→</button>
    <h2>${s.ico} ${s.name}</h2></div>${siteBody(s)}`;
}

window.signIn=signIn; window.switchAccount=switchAccount;
let lastKey='';
function render(){
  const s=byId[location.hash.slice(1)];
  const html=s?renderSite(s):renderHome();
  // don't rebuild while typing in the search box (keeps focus and caret)
  const active=document.activeElement;
  if(active&&active.type==='search'&&s&&lastKey===s.id){
    const keep=active.value, pos=active.selectionStart;
    document.getElementById('app').innerHTML=html;
    const inp=document.querySelector('.tools input'); if(inp){ inp.value=keep; inp.focus(); try{inp.setSelectionRange(pos,pos);}catch(e){} }
  } else document.getElementById('app').innerHTML=html;
  lastKey=s?s.id:'';
}
window.addEventListener('hashchange',()=>{ view.q=''; render(); window.scrollTo(0,0); });
// relative times ("לפני 5 דק'") stay fresh
setInterval(()=>{ if(document.activeElement?.type!=='search') render(); },60000);
render();
</script>
</body>
