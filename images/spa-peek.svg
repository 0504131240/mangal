<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 40 296 226">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2416"/><stop offset=".62" stop-color="#6A4228"/><stop offset="1" stop-color="#2A180E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD48A" stop-opacity=".75"/><stop offset=".4" stop-color="#FFB45A" stop-opacity=".25"/><stop offset="1" stop-color="#FFB45A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB6B0"/><stop offset="1" stop-color="#2E5C5A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5A34"/><stop offset="1" stop-color="#4E3019"/>
    </linearGradient>
    <radialGradient id="stone" cx=".38" cy=".3" r=".75">
      <stop offset="0" stop-color="#6E6A66"/><stop offset=".55" stop-color="#34302D"/><stop offset="1" stop-color="#171412"/>
    </radialGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D2C7"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9DCC6"/><stop offset=".5" stop-color="#FFF8EC"/><stop offset="1" stop-color="#CDBEA6"/>
    </linearGradient>
    <radialGradient id="petal" cx=".5" cy=".6" r=".6">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2D7E4"/>
    </radialGradient>
  </defs>

  <!-- warm wall and soft light -->
  <rect width="320" height="276" fill="url(#wall)"/>
  <circle cx="250" cy="70" r="120" fill="url(#glow)" opacity=".55"/>

  <!-- bamboo stems on the right -->
  <g stroke-linecap="round">
    <path d="M286 0V168" stroke="#7E8C3A" stroke-width="9"/>
    <path d="M304 0V168" stroke="#6C7A30" stroke-width="7"/>
    <path d="M281 52h10M281 112h10M300 34h8M300 96h8" stroke="#4E5A22" stroke-width="2"/>
    <path d="M286 60c-14-6-26-4-36 4c12 2 24 2 36-4z" fill="#8FA347"/>
    <path d="M304 122c-12-8-24-8-34-2c12 4 22 5 34 2z" fill="#7F933C"/>
  </g>

  <!-- wooden counter -->
  <rect x="0" y="166" width="320" height="110" fill="url(#wood)"/>
  <path d="M0 166h320" stroke="#A97648" stroke-width="2"/>
  <path d="M0 190c60 4 120-2 180 2s100 0 140-2M0 214c70-3 140 3 210 0s80-2 110 1" stroke="#3E2614" stroke-width="1" fill="none" opacity=".6"/>

  <!-- water bowl with floating petals -->
  <ellipse cx="226" cy="176" rx="62" ry="13" fill="#1F120A" opacity=".5"/>
  <path d="M166 160c4 18 26 26 60 26s56-8 60-26z" fill="#E8E1D6"/>
  <ellipse cx="226" cy="160" rx="60" ry="11" fill="url(#water)"/>
  <ellipse cx="226" cy="160" rx="60" ry="11" fill="none" stroke="#F6F1E8" stroke-width="2.5"/>
  <g fill="#F28AA6"><ellipse cx="208" cy="159" rx="6" ry="2.6"/><ellipse cx="246" cy="161" rx="5" ry="2.2" fill="#F6B04A"/><ellipse cx="228" cy="156" rx="4" ry="1.8"/></g>

  <!-- rolled towels -->
  <g>
    <rect x="18" y="140" width="92" height="28" rx="14" fill="url(#towel)"/>
    <circle cx="104" cy="154" r="14" fill="#F4EFE6"/>
    <path d="M104 154m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M104 154m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0" fill="none" stroke="#C9C0B2" stroke-width="1.5"/>
    <rect x="30" y="114" width="80" height="28" rx="14" fill="url(#towel)"/>
    <circle cx="104" cy="128" r="14" fill="#F4EFE6"/>
    <path d="M104 128m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M104 128m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0" fill="none" stroke="#C9C0B2" stroke-width="1.5"/>
    <path d="M50 114v28M50 140v28" stroke="#C9A97A" stroke-width="3"/>
  </g>

  <!-- stacked massage stones -->
  <g>
    <ellipse cx="150" cy="168" rx="30" ry="6" fill="#120B07" opacity=".55"/>
    <ellipse cx="150" cy="156" rx="30" ry="12" fill="url(#stone)"/>
    <ellipse cx="148" cy="136" rx="24" ry="10" fill="url(#stone)"/>
    <ellipse cx="151" cy="119" rx="18" ry="8" fill="url(#stone)"/>
    <ellipse cx="149" cy="105" rx="12" ry="6" fill="url(#stone)"/>
  </g>

  <!-- orchid sprig on the stones -->
  <g>
    <path d="M150 100c8-14 22-22 40-24" stroke="#5B7A2E" stroke-width="2" fill="none"/>
    <g transform="translate(170 84)">
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(288)"/>
      <circle r="3.2" fill="#D9487A"/><circle r="1.4" fill="#F6C84A"/>
    </g>
    <g transform="translate(190 76) scale(.75)">
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#petal)" transform="rotate(288)"/>
      <circle r="3.2" fill="#D9487A"/>
    </g>
  </g>

  <!-- candles with soft glow -->
  <g>
    <circle cx="44" cy="96" r="34" fill="url(#glow)"/>
    <circle cx="74" cy="104" r="26" fill="url(#glow)"/>
    <rect x="34" y="96" width="20" height="20" rx="2" fill="url(#wax)" transform="translate(-6 0)"/>
    <path d="M38 96v-4" stroke="#2A1A10" stroke-width="1.2"/>
    <path d="M38 92c-4-5 0-11 0-14c2 4 5 8 0 14z" fill="#FFC85A"/>
    <path d="M38 91c-2-3 0-6 0-8c1 2 2 5 0 8z" fill="#FFF3C4"/>
    <rect x="66" y="104" width="16" height="12" rx="2" fill="url(#wax)"/>
    <path d="M74 104v-3" stroke="#2A1A10" stroke-width="1.2"/>
    <path d="M74 101c-3-4 0-9 0-11c2 3 4 7 0 11z" fill="#FFC85A"/>
    <path d="M74 100c-1.5-2 0-4.5 0-6c1 1.5 1.5 4 0 6z" fill="#FFF3C4"/>
  </g>
</svg>
